<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheInfoDB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }
        * { font-family: var(--font-sans); }
        code, pre, kbd, samp { font-family: var(--font-mono); }

        body {
            font-family: var(--font-sans);
            background-color: #000;
            color: #e5e5e5;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .panel-stylized {
            border: 1px solid #262626;
            background-color: #050505;
            border-radius: 0.5rem;
            padding: 1.5rem 1.75rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s ease;
        }
        .panel-stylized:hover { border-color: #333; }
        .panel-stylized:last-child { margin-bottom: 0; }

        .subtopic-panel {
            border: 1px solid #1a1a1a;
            background-color: #080808;
            border-radius: 0.375rem;
            padding: 1.1rem 1.25rem 1rem;
            margin-top: 1rem;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .subtopic-panel:hover {
            border-color: #2a2a2a;
            background-color: #0a0a0a;
        }

        .h3-block {
            margin-top: 1rem;
            padding-left: 0.9rem;
            border-left: 2px solid #1f1f1f;
        }

        .panel-raw {
            margin-bottom: 1.5rem;
            padding: 1rem;
        }

        .tree-details > summary {
            list-style: none;
            cursor: pointer;
            padding: 0.15rem 0.3rem;
            border-radius: 0.25rem;
        }
        .tree-details > summary::-webkit-details-marker { display: none; }
        .tree-details > summary:hover { background-color: #1a1a1a; }
        .tree-details[open] > summary .details-arrow { transform: rotate(90deg); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 100;
        }
        .toast.show { opacity: 1; }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #0a0a0a;
            min-width: 120px;
            border: 1px solid #333;
            border-radius: 4px;
            z-index: 50;
        }
        .dropdown-content button {
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
        }
        .dropdown-content button:hover { background-color: #1a1a1a; }
        .dropdown:focus-within .dropdown-content { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; margin-bottom: 0.75rem; }
        th, td { border: 1px solid #262626; padding: 0.5rem 0.75rem; text-align: left; font-size: 0.875rem; }
        th { background-color: #111; color: #fff; }
        ul, ol { padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        li { margin-bottom: 0.25rem; }

        .split-column {
            flex: 1;
            min-width: 0;
            max-height: calc(100vh - 8rem);
            overflow-y: auto;
            padding-right: 0.5rem;
            overscroll-behavior: contain;
        }
        .column-header {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            border-bottom: 1px solid #1a1a1a;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(6px);
        }

        .hover-actions {
            opacity: 0;
            transition: opacity 0.15s ease;
            display: flex;
            gap: 0.6rem;
            flex-shrink: 0;
        }
        .group:hover > * > .hover-actions,
        .group:hover > .hover-actions,
        .group:hover .hover-actions { opacity: 1; }

        /* ---------- Jump-to menu ---------- */
        #jump-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 320px;
            max-width: 480px;
            max-height: 480px;
            overflow-y: auto;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            z-index: 60;
            padding: 6px 0;
        }
        #jump-menu.open { display: block; }
        #jump-menu .jump-group-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #525252;
            padding: 6px 12px 4px;
        }
        #jump-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: #d4d4d4;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #jump-menu button:hover { background: #1a1a1a; color: #fff; }
        #jump-menu button.lvl-1 { font-weight: 600; color: #fff; }
        #jump-menu button.lvl-2 { padding-left: 24px; }
        #jump-menu button.lvl-3 { padding-left: 36px; color: #a3a3a3; font-size: 11px; }
        #jump-menu button .slot-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #525252;
            margin-right: 6px;
        }

        /* Brief highlight when jumping */
        @keyframes jumpFlash {
            0%   { background-color: rgba(255,255,255,0.06); border-color: #525252; }
            100% { background-color: transparent; border-color: inherit; }
        }
        .jump-target {
            animation: jumpFlash 1.2s ease-out;
        }
        .jump-target-h3 {
            animation: jumpFlash 1.2s ease-out;
        }
    </style>
</head>
<body>

    <aside class="w-72 border-r border-neutral-800 bg-[#030303] flex flex-col h-full shrink-0">
        <div class="p-4 border-b border-neutral-800 space-y-3">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold text-white tracking-tight">TheInfoDB</h1>
            </div>
            <div class="relative flex items-center">
                <input type="text" id="quick-search-input" data-i18n-placeholder="searchEverythingPlaceholder" placeholder="Search everything..."
                       class="w-full bg-neutral-900 border border-neutral-700 text-sm text-white rounded px-3 py-1.5 focus:outline-none focus:border-neutral-500 pr-8">
                <button id="quick-search-clear" class="absolute right-2 text-neutral-500 hover:text-white hidden">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-2">
            <div class="flex items-center justify-between px-1">
                <div class="text-[10px] font-semibold text-neutral-500 uppercase tracking-wider" data-i18n="pagesTitle">Pages</div>
            </div>
            <div class="relative flex items-center">
                <input type="text" id="page-search-input" data-i18n-placeholder="searchPagesPlaceholder" placeholder="Search pages..."
                       class="w-full bg-neutral-900 border border-neutral-700 text-xs text-white rounded px-2.5 py-1.5 focus:outline-none focus:border-neutral-500 pr-7">
                <button id="page-search-clear" class="absolute right-2 text-neutral-500 hover:text-white hidden">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="pages-tree" class="text-xs mt-1"></div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-black h-full relative overflow-hidden min-w-0">
        <header class="h-14 border-b border-neutral-800 flex items-center justify-between px-6 bg-[#030303] shrink-0">
            <div id="breadcrumb" class="text-sm font-medium text-neutral-400 truncate mr-4">
                Dashboard
            </div>

            <div class="flex items-center space-x-3 shrink-0">
                <select id="view-mode-select" class="bg-transparent border border-neutral-700 text-sm text-white rounded px-2 py-1 outline-none">
                    <option value="Stylized" data-i18n="viewModeStylized">Stylized</option>
                    <option value="Raw" data-i18n="viewModeRaw">Raw</option>
                </select>

                <select id="ui-language-select" class="bg-transparent border border-neutral-700 text-sm text-white rounded px-2 py-1 outline-none">
                    <option value="English">English</option>
                    <option value="German">German</option>
                </select>

                <!-- Jump To Section Button -->
                <div class="dropdown relative" id="jump-dropdown" style="display:none;">
                    <button id="jump-to-btn" class="p-2 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800 transition-colors" title="Jump to section">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="15" y2="12"></line>
                            <line x1="3" y1="18" x2="11" y2="18"></line>
                            <polyline points="17 14 20 17 23 14"></polyline>
                        </svg>
                    </button>
                    <div id="jump-menu"></div>
                </div>

                <button id="toggle-split-view-btn" class="p-2 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800 transition-colors" title="Split View">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                </button>

                <div class="dropdown relative" tabindex="0">
                    <button class="p-2 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800" title="Download">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                    <div class="dropdown-content mt-1">
                        <button id="dl-doc-txt" data-i18n="downloadTextfile">Textfile</button>
                        <button id="dl-doc-md" data-i18n="downloadMarkdown">Markdown</button>
                    </div>
                </div>

                <button id="toggle-pins-btn" class="p-2 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800 transition-colors" title="Pins">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
            </div>
        </header>

        <div id="content-scroll-area" class="flex-1 overflow-y-auto p-8">
            <div id="dashboard-view" class="max-w-6xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-white" data-i18n="dashboardOverview">Overview</h2>
                <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="text-neutral-500">Loading GitHub Repository Tree...</div>
                </div>
            </div>

            <div id="document-view" class="max-w-4xl mx-auto hidden transition-all duration-300">
                <div id="document-layout" class="flex flex-col md:flex-row gap-6 w-full">
                    <div id="document-content" class="flex-1 w-full min-w-0"></div>
                    <div id="document-content-secondary" class="flex-1 w-full min-w-0 hidden"></div>
                </div>
            </div>
        </div>
    </main>

    <aside id="pins-sidebar" class="w-80 border-l border-neutral-800 bg-[#050505] flex flex-col hidden h-full shrink-0">
        <div class="h-14 border-b border-neutral-800 flex items-center justify-between px-4 shrink-0">
            <h2 class="font-semibold text-white" data-i18n="pinnedTopicsTitle">Pinned Topics</h2>
            <div class="flex items-center space-x-2">
                <div class="dropdown relative" tabindex="0">
                    <button class="text-neutral-400 hover:text-white p-1" title="Download All Pins">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                    <div class="dropdown-content mt-1 right-0 min-w-[100px]">
                        <button id="dl-pins-txt" data-i18n="downloadTextfile">Textfile</button>
                        <button id="dl-pins-md" data-i18n="downloadMarkdown">Markdown</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="pins-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <div id="no-pins-msg" class="text-neutral-500 text-sm text-center mt-10" data-i18n="noPinsMsg">No topics pinned yet.</div>
        </div>
    </aside>

    <div id="context-menu" class="hidden fixed bg-[#0a0a0a] border border-neutral-700 rounded z-50 py-1 min-w-[120px]">
        <button id="ctx-open-left" class="w-full text-left px-3 py-1.5 text-xs text-white hover:bg-neutral-800">Open Left</button>
        <button id="ctx-open-right" class="w-full text-left px-3 py-1.5 text-xs text-white hover:bg-neutral-800">Open Right</button>
    </div>

    <div id="link-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="bg-[#111] border border-neutral-800 rounded-lg p-6 max-w-sm w-full">
            <h3 class="text-lg font-bold text-white mb-2" data-i18n="linkModalTitle">External Link</h3>
            <p class="text-neutral-400 text-sm mb-6" data-i18n="linkModalText">You are leaving this page. Are you sure?</p>
            <div class="flex justify-end space-x-3">
                <button id="link-cancel" class="px-4 py-2 text-sm text-white border border-neutral-700 rounded hover:bg-neutral-800" data-i18n="linkModalCancel">Cancel</button>
                <button id="link-okay" class="px-4 py-2 text-sm text-black bg-white rounded hover:bg-neutral-200" data-i18n="linkModalOkay">Okay</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Message</div>

    <script>
        const state = {
            pages: [],
            fileCache: {},
            hyperlinks: {},
            pinnedTopics: [],
            currentActiveFile: null,
            splitFile1: null,
            splitFile2: null,
            slot1Language: 'English',
            slot2Language: 'English',
            viewMode: 'Stylized',
            isSplitView: false,
            pendingLink: '',
            uiLanguage: 'English',
            translations: {},
            contextFile: null
        };

        const defaultTranslations = {
            searchPagesPlaceholder: "Search pages...",
            searchEverythingPlaceholder: "Search everything...",
            pagesTitle: "Pages",
            dashboardTitle: "Dashboard",
            viewModeStylized: "Stylized",
            viewModeRaw: "Raw",
            downloadTextfile: "Textfile",
            downloadMarkdown: "Markdown",
            dashboardOverview: "Overview",
            noMatchingTopics: "No matching topics found.",
            pinnedTopicsTitle: "Pinned Topics",
            noPinsMsg: "No topics pinned yet.",
            linkModalTitle: "External Link",
            linkModalText: "You are leaving this page. Are you sure?",
            linkModalCancel: "Cancel",
            linkModalOkay: "Okay",
            toastCopied: "Copied to Clipboard!",
            toastPinned: "Pinned topic",
            toastNoFile: "No file selected.",
            toastNoPins: "No pins to download.",
            searchResults: "Search Results:",
            jumpToTitle: "Jump to section",
            jumpNoSections: "No sections in this document."
        };

        const dom = {
            qsInput: document.getElementById('quick-search-input'),
            qsClear: document.getElementById('quick-search-clear'),
            pageSearchInput: document.getElementById('page-search-input'),
            pageSearchClear: document.getElementById('page-search-clear'),
            pagesTree: document.getElementById('pages-tree'),
            dashboardView: document.getElementById('dashboard-view'),
            dashboardGrid: document.getElementById('dashboard-grid'),
            documentView: document.getElementById('document-view'),
            documentContent: document.getElementById('document-content'),
            documentContentSecondary: document.getElementById('document-content-secondary'),
            breadcrumb: document.getElementById('breadcrumb'),
            viewModeSelect: document.getElementById('view-mode-select'),
            uiLanguageSelect: document.getElementById('ui-language-select'),
            toggleSplitViewBtn: document.getElementById('toggle-split-view-btn'),
            pinsBtn: document.getElementById('toggle-pins-btn'),
            pinsSidebar: document.getElementById('pins-sidebar'),
            pinsContainer: document.getElementById('pins-container'),
            noPinsMsg: document.getElementById('no-pins-msg'),
            toast: document.getElementById('toast'),
            linkModal: document.getElementById('link-modal'),
            linkCancel: document.getElementById('link-cancel'),
            linkOkay: document.getElementById('link-okay'),
            contextMenu: document.getElementById('context-menu'),
            ctxOpenLeft: document.getElementById('ctx-open-left'),
            ctxOpenRight: document.getElementById('ctx-open-right'),
            jumpDropdown: document.getElementById('jump-dropdown'),
            jumpBtn: document.getElementById('jump-to-btn'),
            jumpMenu: document.getElementById('jump-menu')
        };

        async function init() {
            await loadHyperlinks();
            await loadLanguage(state.uiLanguage);
            await fetchGitHubTree();
            renderTree(state.pages, dom.pagesTree);
            renderDashboard();
            setupEventListeners();
            preloadContentForAllLanguages();
        }

        async function loadHyperlinks() {
            try {
                const res = await fetch('./hyperlinks.json');
                if (res.ok) {
                    state.hyperlinks = await res.json();
                }
            } catch (e) {
                state.hyperlinks = {};
            }
        }

        async function fetchGitHubTree() {
            try {
                const res = await fetch('https://api.github.com/repos/cmdrFRANKLY1/TheInfoDB/git/trees/main?recursive=1');
                if (!res.ok) throw new Error("Could not reach GitHub API");
                const data = await res.json();

                const pagesMap = {};
                const formatName = (str) => {
                    if (!str) return '';
                    return str.replace(/([a-z])([A-Z])/g, '$1 $2').trim();
                };

                data.tree.forEach(node => {
                    if (node.type === 'blob' && node.path.startsWith('Pages/') && node.path.endsWith('.md')) {
                        const pathParts = node.path.split('/');
                        const filename = pathParts.pop();
                        const cleanName = filename.replace(/_in[a-zA-Z]+\.md$/, '').replace(/\.md$/, '');

                        const dirParts = pathParts.slice(1);
                        let title = cleanName;

                        if (dirParts.length > 0) {
                            const lastFolder = dirParts[dirParts.length - 1];
                            if (lastFolder.toLowerCase() === cleanName.toLowerCase()) {
                                dirParts.pop();
                            }
                        }

                        const displayTitle = formatName(title);
                        const displayCategoryParts = dirParts.map(formatName);
                        const category = displayCategoryParts.join(' / ');
                        const id = displayCategoryParts.length > 0 ? `${category}/${displayTitle}` : displayTitle;

                        const langMatch = filename.match(/_in([a-zA-Z]+)\.md$/);
                        const lang = langMatch ? langMatch[1] : 'English';

                        if (!pagesMap[id]) {
                            pagesMap[id] = {
                                id,
                                title: displayTitle,
                                category,
                                categoryParts: displayCategoryParts,
                                paths: {}
                            };
                        }
                        pagesMap[id].paths[lang] = node.path;
                    }
                });
                state.pages = Object.values(pagesMap);
            } catch (e) {
                console.error(e);
                dom.dashboardGrid.innerHTML = `<div class="text-red-500">Failed to load repository tree. Check console for details.</div>`;
            }
        }

        async function preloadContentForAllLanguages() {
            const promises = [];
            state.pages.forEach(pageObj => {
                Object.values(pageObj.paths).forEach(path => {
                    if (path && !state.fileCache[path]) {
                        promises.push(
                            fetch(`https://raw.githubusercontent.com/cmdrFRANKLY1/TheInfoDB/main/${path}`)
                                .then(res => res.ok ? res.text() : null)
                                .then(text => { if (text) state.fileCache[path] = text; })
                                .catch(() => {})
                        );
                    }
                });
            });
            await Promise.allSettled(promises);
        }

        async function loadLanguage(lang) {
            try {
                const res = await fetch(`./languages/index/indexLanguage_${lang}.json`);
                if (res.ok) {
                    state.translations = await res.json();
                } else {
                    state.translations = defaultTranslations;
                }
            } catch (e) {
                state.translations = defaultTranslations;
            }
            applyTranslations();
        }

        function applyTranslations() {
            const t = state.translations;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });
            if (!state.currentActiveFile && dom.dashboardView.classList.contains('hidden') === false) {
                dom.breadcrumb.textContent = t.dashboardTitle;
            }
            if (state.pinnedTopics.length === 0) {
                dom.noPinsMsg.textContent = t.noPinsMsg;
            }
            if (dom.jumpBtn) dom.jumpBtn.title = t.jumpToTitle || 'Jump to section';
        }

        function showToast(msg) {
            dom.toast.textContent = msg;
            dom.toast.classList.add('show');
            setTimeout(() => dom.toast.classList.remove('show'), 2000);
        }

        function getFileDisplayPath(file) {
            if (!file) return "";
            return file.category && file.category !== '' ? `${file.category} / ${file.title}` : file.title;
        }

        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function pickLang(file) {
            if (!file || !file.paths) return 'English';
            if (file.paths[state.uiLanguage]) return state.uiLanguage;
            if (file.paths['English']) return 'English';
            return Object.keys(file.paths)[0];
        }

        function renderTree(files, container) {
            container.innerHTML = '';
            const tree = { folders: {}, files: [] };

            files.forEach(f => {
                let current = tree;
                if (f.categoryParts && f.categoryParts.length > 0) {
                    f.categoryParts.forEach(part => {
                        if (!current.folders[part]) current.folders[part] = { folders: {}, files: [] };
                        current = current.folders[part];
                    });
                }
                current.files.push(f);
            });

            function buildDOM(node, containerElement) {
                Object.keys(node.folders).sort().forEach(folderName => {
                    const details = document.createElement('details');
                    details.className = "tree-details mb-0.5";
                    details.open = false; // Loaded fully collapsed by default

                    const summary = document.createElement('summary');
                    summary.className = "text-neutral-300 font-medium flex items-center select-none text-xs py-0.5 px-1 rounded";
                    summary.innerHTML = `<svg width="10" height="10" class="mr-1.5 text-neutral-500 transition-transform duration-200 details-arrow shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg> <span class="truncate">${folderName}</span>`;

                    const list = document.createElement('div');
                    list.className = "pl-3 ml-1 space-y-0.5 border-l border-neutral-800/60";

                    buildDOM(node.folders[folderName], list);
                    details.appendChild(summary);
                    details.appendChild(list);
                    containerElement.appendChild(details);
                });

                node.files.sort((a,b) => a.title.localeCompare(b.title)).forEach(file => {
                    const el = document.createElement('div');
                    el.className = "text-neutral-400 hover:text-white cursor-pointer py-1 px-1 text-xs flex items-center justify-between group rounded hover:bg-neutral-900";

                    const leftPart = document.createElement('div');
                    leftPart.className = "flex items-center truncate mr-2 flex-1";
                    leftPart.innerHTML = `<svg width="10" height="10" class="mr-1.5 text-neutral-600 group-hover:text-neutral-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> <span class="truncate">${file.title}</span>`;

                    el.appendChild(leftPart);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = "flex items-center space-x-1 shrink-0 " + (state.isSplitView ? "" : "hidden");

                    const lBtn = document.createElement('button');
                    lBtn.className = "px-1.5 py-0.5 text-[10px] font-mono bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 hover:text-white rounded";
                    lBtn.textContent = "L";
                    lBtn.onclick = (e) => {
                        e.stopPropagation();
                        state.splitFile1 = file;
                        state.slot1Language = pickLang(file);
                        renderSplitView();
                    };

                    const rBtn = document.createElement('button');
                    rBtn.className = "px-1.5 py-0.5 text-[10px] font-mono bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 hover:text-white rounded";
                    rBtn.textContent = "R";
                    rBtn.onclick = (e) => {
                        e.stopPropagation();
                        state.splitFile2 = file;
                        state.slot2Language = pickLang(file);
                        renderSplitView();
                    };

                    actionsDiv.appendChild(lBtn);
                    actionsDiv.appendChild(rBtn);
                    el.appendChild(actionsDiv);

                    el.onclick = () => {
                        if (state.isSplitView) {
                            if (!state.splitFile1) {
                                state.splitFile1 = file;
                                state.slot1Language = pickLang(file);
                            } else if (!state.splitFile2) {
                                state.splitFile2 = file;
                                state.slot2Language = pickLang(file);
                            } else {
                                state.splitFile1 = file;
                                state.slot1Language = pickLang(file);
                            }
                            renderSplitView();
                        } else {
                            handleFileSelection(file);
                        }
                    };

                    el.oncontextmenu = (e) => {
                        e.preventDefault();
                        state.contextFile = file;
                        dom.contextMenu.style.top = `${e.clientY}px`;
                        dom.contextMenu.style.left = `${e.clientX}px`;
                        dom.contextMenu.classList.remove('hidden');
                    };

                    containerElement.appendChild(el);
                });
            }
            buildDOM(tree, container);
        }

        function renderDashboard() {
            state.currentActiveFile = null;
            state.splitFile1 = null;
            state.splitFile2 = null;
            dom.documentView.classList.add('hidden');
            dom.dashboardView.classList.remove('hidden');
            dom.breadcrumb.textContent = state.translations.dashboardTitle || "Dashboard";
            updateJumpMenuVisibility();

            const shuffled = [...state.pages].sort(() => 0.5 - Math.random());
            dom.dashboardGrid.innerHTML = '';

            shuffled.forEach(file => {
                const card = document.createElement('div');
                card.className = "border border-neutral-800 p-5 rounded-lg bg-[#050505] hover:bg-neutral-900 cursor-pointer transition-all duration-200 hover:border-neutral-700";
                card.innerHTML = `
                    <div class="text-xs text-neutral-500 mb-2 font-mono">${getFileDisplayPath(file)}</div>
                    <h3 class="text-lg font-bold text-white">${file.title}</h3>
                `;
                card.onclick = () => handleFileSelection(file);
                dom.dashboardGrid.appendChild(card);
            });
        }

        async function fetchContent(path) {
            if (state.fileCache[path]) return state.fileCache[path];
            try {
                const res = await fetch(`https://raw.githubusercontent.com/cmdrFRANKLY1/TheInfoDB/main/${path}`);
                if (res.ok) {
                    const text = await res.text();
                    state.fileCache[path] = text;
                    return text;
                }
                return "Failed to fetch document content.";
            } catch(e) {
                return "Network error loading document.";
            }
        }

        async function handleFileSelection(pageObj, preferredLang = null) {
            dom.dashboardView.classList.add('hidden');
            dom.documentView.classList.remove('hidden');
            dom.documentView.classList.remove('max-w-7xl', 'w-full');
            dom.documentView.classList.add('max-w-4xl');

            const targetLang = preferredLang || state.uiLanguage;
            const defaultLang = pageObj.paths[targetLang] ? targetLang : pickLang(pageObj);
            state.slot1Language = defaultLang;

            if (state.isSplitView) {
                if (!state.splitFile1) {
                    state.splitFile1 = pageObj;
                    state.slot1Language = defaultLang;
                } else if (!state.splitFile2) {
                    state.splitFile2 = pageObj;
                    state.slot2Language = defaultLang;
                } else {
                    state.splitFile1 = pageObj;
                    state.slot1Language = defaultLang;
                }
                await renderSplitView();
            } else {
                state.currentActiveFile = pageObj;
                state.splitFile1 = null;
                state.splitFile2 = null;

                dom.documentContent.classList.remove('split-column');
                dom.documentContentSecondary.classList.add('hidden');
                dom.documentContentSecondary.classList.remove('split-column');

                dom.breadcrumb.textContent = getFileDisplayPath(pageObj);
                dom.documentContent.innerHTML = '<div class="text-neutral-500 mt-10">Loading...</div>';
                const path = pageObj.paths[defaultLang] || pageObj.paths['English'] || Object.values(pageObj.paths)[0];

                if (!path) {
                    dom.documentContent.innerHTML = '<div class="text-red-500 mt-10">No content available.</div>';
                    updateJumpMenuVisibility();
                    return;
                }

                const content = await fetchContent(path);
                parseAndRenderMarkdownDocument(content, dom.documentContent, pageObj, false, '', '1', null, state.slot1Language, (newLang) => {
                    state.slot1Language = newLang;
                    handleFileSelection(pageObj, newLang);
                });
            }
        }

        async function renderSplitView() {
            dom.documentView.classList.remove('max-w-4xl');
            dom.documentView.classList.add('max-w-7xl', 'w-full');
            dom.documentContentSecondary.classList.remove('hidden');
            dom.documentContent.classList.add('split-column');
            dom.documentContentSecondary.classList.add('split-column');

            let breadcrumbParts = [];

            if (state.splitFile1) {
                breadcrumbParts.push(`[1] ${getFileDisplayPath(state.splitFile1)}`);
                dom.documentContent.innerHTML = '<div class="text-neutral-500 mt-10">Loading 1...</div>';
                const path1 = state.splitFile1.paths[state.slot1Language] || state.splitFile1.paths['English'] || Object.values(state.splitFile1.paths)[0];
                const content1 = path1 ? await fetchContent(path1) : "No content available.";
                parseAndRenderMarkdownDocument(content1, dom.documentContent, state.splitFile1, false, '', '1', () => {
                    state.splitFile1 = null;
                    renderSplitView();
                }, state.slot1Language, (newLang) => {
                    state.slot1Language = newLang;
                    renderSplitView();
                }, '◀ LEFT', '#60a5fa');
            } else {
                dom.documentContent.innerHTML =
                    '<div class="column-header" style="color:#60a5fa;">◀ LEFT</div>' +
                    '<div class="text-neutral-500 text-center mt-12 p-8 border border-dashed border-neutral-800 rounded-lg">Select topic for Left from the sidebar or click [L]</div>';
            }

            if (state.splitFile2) {
                breadcrumbParts.push(`[2] ${getFileDisplayPath(state.splitFile2)}`);
                dom.documentContentSecondary.innerHTML = '<div class="text-neutral-500 mt-10">Loading 2...</div>';
                const path2 = state.splitFile2.paths[state.slot2Language] || state.splitFile2.paths['English'] || Object.values(state.splitFile2.paths)[0];
                const content2 = path2 ? await fetchContent(path2) : "No content available.";
                parseAndRenderMarkdownDocument(content2, dom.documentContentSecondary, state.splitFile2, false, '', '2', () => {
                    state.splitFile2 = null;
                    renderSplitView();
                }, state.slot2Language, (newLang) => {
                    state.slot2Language = newLang;
                    renderSplitView();
                }, 'RIGHT ▶', '#34d399');
            } else {
                dom.documentContentSecondary.innerHTML =
                    '<div class="column-header" style="color:#34d399;">RIGHT ▶</div>' +
                    '<div class="text-neutral-500 text-center mt-12 p-8 border border-dashed border-neutral-800 rounded-lg">Select topic for Right from the sidebar or click [R]</div>';
            }

            dom.breadcrumb.textContent = breadcrumbParts.length > 0 ? breadcrumbParts.join(' | ') : "Split View";
        }

        async function executeGlobalSearch(query) {
            if (!query) {
                if (state.currentActiveFile) handleFileSelection(state.currentActiveFile);
                else renderDashboard();
                return;
            }

            dom.documentView.classList.remove('max-w-7xl', 'w-full');
            dom.documentView.classList.add('max-w-4xl');
            dom.documentContentSecondary.classList.add('hidden');
            dom.documentContent.classList.remove('split-column');
            dom.documentContentSecondary.classList.remove('split-column');

            dom.dashboardView.classList.add('hidden');
            dom.documentView.classList.remove('hidden');
            dom.breadcrumb.textContent = `${state.translations.searchResults || 'Search Results:'} "${query}"`;
            dom.documentContent.innerHTML = '';

            const lang = state.slot1Language;
            const q = query.toLowerCase();
            let foundAny = false;

            for (const file of state.pages) {
                const path = file.paths[lang] || file.paths['English'] || Object.values(file.paths)[0];
                if (!path) continue;
                const content = await fetchContent(path);
                if (content.toLowerCase().includes(q)) {
                    foundAny = true;
                    parseAndRenderMarkdownDocument(content, dom.documentContent, file, true, query, '', null, lang, null);
                }
            }

            if (!foundAny) {
                dom.documentContent.innerHTML = `<div class="text-neutral-500 text-center mt-10">${state.translations.noMatchingTopics}</div>`;
            }
            updateJumpMenuVisibility();
        }

        function formatMarkdownText(text) {
            if (!text) return '';
            let formatted = text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code class="bg-neutral-900 border border-neutral-800 text-neutral-200 px-1.5 py-0.5 rounded text-xs font-mono">$1</code>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" class="text-blue-400 hover:underline external-link">$1</a>');

            if (state.hyperlinks && Object.keys(state.hyperlinks).length > 0) {
                Object.entries(state.hyperlinks).forEach(([term, url]) => {
                    const regex = new RegExp(`\\b(${term})\\b(?![^<]*>|[^<>]*</a>)`, 'g');
                    formatted = formatted.replace(regex, `<a href="${url}" class="text-blue-400 hover:underline external-link">$1</a>`);
                });
            }

            const lines = formatted.split('\n');
            const out = [];
            let listBuffer = [];
            const flushList = () => {
                if (listBuffer.length) {
                    out.push(`<ul class="list-disc pl-5 space-y-1 my-2">${listBuffer.map(i => `<li>${i}</li>`).join('')}</ul>`);
                    listBuffer = [];
                }
            };
            lines.forEach(line => {
                if (line.trim().startsWith('- ')) {
                    listBuffer.push(line.trim().replace(/^- /, ''));
                } else {
                    flushList();
                    out.push(line);
                }
            });
            flushList();

            return out.join('<br>').replace(/(<br>)+(<ul)/g, '$2').replace(/(<\/ul>)(<br>)+/g, '$1');
        }

        /* =========================================================
           ADVANCED MARKDOWN PARSER (Tables, HR, Code Blocks)
           ========================================================= */
        function parseAdvancedMarkdown(content) {
            const lines = content.split('\n');
            let overallTitle = "Document";
            const mainSections = [];
            let currentMain = null;
            let currentSub = null;
            let introBuffer = [];

            const flushIntro = () => {
                if (currentMain && introBuffer.length > 0 && !currentMain.intro) {
                    currentMain.intro = processBlockContent(introBuffer);
                }
                introBuffer = [];
            };

            let i = 0;
            while (i < lines.length) {
                const line = lines[i];

                if (line.startsWith('# ')) {
                    if (currentMain) {
                        flushIntro();
                        if (currentSub) { currentMain.subtopics.push(currentSub); currentSub = null; }
                        mainSections.push(currentMain);
                    }
                    overallTitle = line.replace(/^#\s+/, '');
                    currentMain = { title: overallTitle, intro: '', subtopics: [] };
                    currentSub = null;
                    i++;
                } else if (line.startsWith('## ') || line.startsWith('### ')) {
                    if (currentMain) {
                        flushIntro();
                        if (currentSub) currentMain.subtopics.push(currentSub);
                        const subTitle = line.replace(/^#{2,3}\s+/, '');
                        const level = line.startsWith('### ') ? 3 : 2;
                        currentSub = { title: subTitle, level, contentLines: [] };
                    }
                    i++;
                } else {
                    if (currentSub) {
                        currentSub.contentLines.push(line);
                    } else {
                        introBuffer.push(line);
                    }
                    i++;
                }
            }

            if (currentMain) {
                flushIntro();
                if (currentSub) currentMain.subtopics.push(currentSub);
                mainSections.push(currentMain);
            }

            if (mainSections.length === 0) {
                mainSections.push({ title: overallTitle, intro: processBlockContent(lines), subtopics: [] });
            }

            return mainSections;
        }

        function processBlockContent(linesArr) {
            const processed = [];
            let tableBuffer = [];

            const flushTable = () => {
                if (tableBuffer.length >= 2) {
                    const headers = tableBuffer[0].split('|').map(s => s.trim()).filter(Boolean);
                    const rows = tableBuffer.slice(2).map(r => r.split('|').map(s => s.trim()).filter(Boolean));
                    let html = '<div class="overflow-x-auto"><table class="w-full border-collapse my-3"><thead><tr>';
                    headers.forEach(h => html += `<th class="border border-neutral-800 p-2 text-left text-xs bg-neutral-900 text-white">${formatMarkdownText(h)}</th>`);
                    html += '</tr></thead><tbody>';
                    rows.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => html += `<td class="border border-neutral-800 p-2 text-xs text-neutral-300">${formatMarkdownText(cell)}</td>`);
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    processed.push(html);
                }
                tableBuffer = [];
            };

            for (let idx = 0; idx < linesArr.length; idx++) {
                const l = linesArr[idx];
                if (l.trim().startsWith('|') && l.trim().endsWith('|')) {
                    tableBuffer.push(l.trim());
                } else {
                    flushTable();
                    if (l.trim() === '---') {
                        processed.push('<hr class="border-neutral-800 my-4">');
                    } else if (l.trim() !== '') {
                        processed.push(formatMarkdownText(l));
                    }
                }
            }
            flushTable();
            return processed.join('<br>');
        }

        /* =========================================================
           MARKDOWN PANELLING — with jump anchors
           ========================================================= */
        function parseAndRenderMarkdownDocument(content, container, fileData, isSearch = false, query = '', slotTag = '', onClose = null, activeDocLang = 'English', onDocLangChange = null, columnLabel = null, columnColor = null) {
            const isRaw = state.viewMode === 'Raw';

            const preservedHeader = columnLabel ? (() => {
                const h = document.createElement('div');
                h.className = 'column-header';
                if (columnColor) h.style.color = columnColor;
                h.textContent = columnLabel;
                return h;
            })() : null;

            if (!isSearch) {
                container.innerHTML = '';
                if (preservedHeader) container.appendChild(preservedHeader);
            }

            const overallWrapper = document.createElement('div');
            overallWrapper.className = 'w-full';

            if (fileData) {
                const slotHeader = document.createElement('div');
                slotHeader.className = "flex justify-between items-center mb-4 pb-3 border-b border-neutral-900 gap-3";

                const titleBadge = document.createElement('span');
                titleBadge.className = "text-xs font-mono text-neutral-400 truncate min-w-0";
                titleBadge.textContent = (slotTag ? `[${slotTag}] ` : "") + getFileDisplayPath(fileData);
                slotHeader.appendChild(titleBadge);

                const rightControls = document.createElement('div');
                rightControls.className = "flex items-center space-x-2 shrink-0";

                const availableLangs = Object.keys(fileData.paths || {});
                // Only show in-document language dropdown if there are multiple language files available
                if (availableLangs.length > 1) {
                    const docLangSelect = document.createElement('select');
                    docLangSelect.className = "bg-neutral-900 border border-neutral-700 text-xs text-white rounded px-2 py-1 outline-none";
                    availableLangs.forEach(l => {
                        const opt = document.createElement('option');
                        opt.value = l;
                        opt.textContent = l;
                        if (l === activeDocLang) opt.selected = true;
                        docLangSelect.appendChild(opt);
                    });
                    docLangSelect.onchange = (e) => {
                        if (slotTag === '2') {
                            state.slot2Language = e.target.value;
                            renderSplitView();
                        } else if (onDocLangChange) {
                            onDocLangChange(e.target.value);
                        }
                    };
                    rightControls.appendChild(docLangSelect);
                }

                if (onClose) {
                    const closeBtn = document.createElement('button');
                    closeBtn.className = "text-neutral-400 hover:text-white bg-neutral-900 hover:bg-neutral-800 text-xs px-2 py-1 rounded border border-neutral-700 flex items-center";
                    closeBtn.innerHTML = `<span>✕</span>`;
                    closeBtn.onclick = onClose;
                    rightControls.appendChild(closeBtn);
                }

                slotHeader.appendChild(rightControls);
                overallWrapper.appendChild(slotHeader);
            }

            const mainSections = parseAdvancedMarkdown(content);
            const displayPath = getFileDisplayPath(fileData);

            mainSections.forEach((section, secIdx) => {
                if (isSearch && query) {
                    const q = query.toLowerCase();
                    const matches = section.title.toLowerCase().includes(q)
                        || (section.intro || '').toLowerCase().includes(q)
                        || section.subtopics.some(s =>
                            s.title.toLowerCase().includes(q) ||
                            s.contentLines.join('\n').toLowerCase().includes(q));
                    if (!matches) return;
                }

                const mainSectionDiv = document.createElement('div');
                mainSectionDiv.className = isRaw ? 'panel-raw' : 'panel-stylized';
                const anchorId = `${slotTag || 'doc'}-h1-${secIdx}`;
                mainSectionDiv.id = anchorId;

                const headerBar = document.createElement('div');
                headerBar.className = "group flex justify-between items-start mb-4 gap-3";

                const titleWrap = document.createElement('div');
                titleWrap.className = "min-w-0";

                const headingEl = document.createElement('h1');
                headingEl.className = "text-2xl font-bold text-white tracking-tight truncate";
                headingEl.textContent = section.title;
                titleWrap.appendChild(headingEl);
                headerBar.appendChild(titleWrap);

                const actions = document.createElement('div');
                actions.className = "hover-actions";

                if (isSearch) {
                    const jumpToResultBtn = document.createElement('button');
                    jumpToResultBtn.className = "text-neutral-500 hover:text-white flex items-center text-xs space-x-1";
                    jumpToResultBtn.title = "Jump to section";
                    jumpToResultBtn.innerHTML = `
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="15" y2="12"></line>
                            <line x1="3" y1="18" x2="11" y2="18"></line>
                            <polyline points="17 14 20 17 23 14"></polyline>
                        </svg>
                    `;
                    jumpToResultBtn.onclick = async () => {
                        dom.qsInput.value = '';
                        dom.qsClear.classList.add('hidden');
                        dom.pageSearchInput.value = '';
                        dom.pageSearchClear.classList.add('hidden');
                        renderTree(state.pages, dom.pagesTree);

                        await handleFileSelection(fileData);
                        setTimeout(() => {
                            jumpToAnchor(anchorId, '1');
                            const breadcrumbStr = `Jumped to ${getFileDisplayPath(fileData)} / ${section.title}`;
                            showToast(breadcrumbStr);
                        }, 150);
                    };
                    actions.appendChild(jumpToResultBtn);
                }

                const pinBtn = document.createElement('button');
                pinBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>';
                pinBtn.className = "text-neutral-500 hover:text-white";
                pinBtn.onclick = () => pinTopic(displayPath, section.title, `${section.title}\n\n${section.intro || ''}`);
                actions.appendChild(pinBtn);

                const copyBtn = document.createElement('button');
                copyBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                copyBtn.className = "text-neutral-500 hover:text-white";
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(`${section.title}\n\n${section.intro || ''}`).then(() => showToast(state.translations.toastCopied));
                };
                actions.appendChild(copyBtn);

                headerBar.appendChild(actions);
                mainSectionDiv.appendChild(headerBar);

                if (section.intro) {
                    if (!isSearch || !query || section.intro.toLowerCase().includes(query.toLowerCase())) {
                        const introDiv = document.createElement('div');
                        introDiv.className = "text-neutral-300 text-sm leading-relaxed mb-2";
                        introDiv.innerHTML = section.intro;
                        mainSectionDiv.appendChild(introDiv);
                    }
                }

                section.subtopics.forEach((sub, subIdx) => {
                    const subText = processBlockContent(sub.contentLines);
                    const rawSubText = sub.contentLines.join('\n').trim();
                    if (isSearch && query
                        && !sub.title.toLowerCase().includes(query.toLowerCase())
                        && !rawSubText.toLowerCase().includes(query.toLowerCase())) {
                        return;
                    }

                    const subAnchorId = `${slotTag || 'doc'}-h${sub.level}-${secIdx}-${subIdx}`;

                    if (sub.level === 3 || isRaw) {
                        const h3Wrap = document.createElement('div');
                        h3Wrap.className = 'h3-block relative group';
                        h3Wrap.id = subAnchorId;

                        const h3TopRow = document.createElement('div');
                        h3TopRow.className = "flex justify-between items-start mb-1.5 gap-3";

                        const h3Title = document.createElement('div');
                        h3Title.className = "text-[11px] font-semibold text-neutral-300 uppercase tracking-wider";
                        h3Title.textContent = sub.title;
                        h3TopRow.appendChild(h3Title);

                        const h3Actions = document.createElement('div');
                        h3Actions.className = "hover-actions";

                        if (isSearch) {
                            const h3JumpBtn = document.createElement('button');
                            h3JumpBtn.className = "text-neutral-500 hover:text-white flex items-center text-xs space-x-1";
                            h3JumpBtn.title = "Jump to subtopic";
                            h3JumpBtn.innerHTML = `
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="3" y1="6" x2="21" y2="6"></line>
                                    <line x1="3" y1="12" x2="15" y2="12"></line>
                                    <line x1="3" y1="18" x2="11" y2="18"></line>
                                    <polyline points="17 14 20 17 23 14"></polyline>
                                </svg>
                            `;
                            h3JumpBtn.onclick = async () => {
                                dom.qsInput.value = '';
                                dom.qsClear.classList.add('hidden');
                                dom.pageSearchInput.value = '';
                                dom.pageSearchClear.classList.add('hidden');
                                renderTree(state.pages, dom.pagesTree);

                                await handleFileSelection(fileData);
                                setTimeout(() => {
                                    jumpToAnchor(subAnchorId, '1');
                                    const breadcrumbStr = `Jumped to ${getFileDisplayPath(fileData)} / ${section.title} / ${sub.title}`;
                                    showToast(breadcrumbStr);
                                }, 150);
                            };
                            h3Actions.appendChild(h3JumpBtn);
                        }

                        const h3PinBtn = document.createElement('button');
                        h3PinBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>';
                        h3PinBtn.className = "text-neutral-500 hover:text-white";
                        h3PinBtn.onclick = () => pinTopic(displayPath, `${section.title} > ${sub.title}`, `${sub.title}\n\n${rawSubText}`);
                        h3Actions.appendChild(h3PinBtn);

                        const h3CopyBtn = document.createElement('button');
                        h3CopyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                        h3CopyBtn.className = "text-neutral-500 hover:text-white";
                        h3CopyBtn.onclick = () => {
                            navigator.clipboard.writeText(`${sub.title}\n\n${rawSubText}`).then(() => showToast(state.translations.toastCopied));
                        };
                        h3CopyBtn.style.marginLeft = "6px";
                        h3Actions.appendChild(h3CopyBtn);

                        h3TopRow.appendChild(h3Actions);
                        h3Wrap.appendChild(h3TopRow);

                        const h3Body = document.createElement('div');
                        h3Body.className = "text-neutral-300 text-sm leading-relaxed";
                        h3Body.innerHTML = subText;
                        h3Wrap.appendChild(h3Body);

                        mainSectionDiv.appendChild(h3Wrap);
                    } else {
                        const subtopicPanel = document.createElement('div');
                        subtopicPanel.className = isRaw ? 'mt-4' : 'subtopic-panel group';
                        subtopicPanel.id = subAnchorId;

                        const subHeader = document.createElement('div');
                        subHeader.className = "flex justify-between items-start mb-2 gap-3";

                        const subTitleEl = document.createElement('h2');
                        subTitleEl.className = "text-base font-semibold text-white";
                        subTitleEl.textContent = sub.title;
                        subHeader.appendChild(subTitleEl);

                        const subActions = document.createElement('div');
                        subActions.className = "hover-actions";

                        if (isSearch) {
                            const subJumpBtn = document.createElement('button');
                            subJumpBtn.className = "text-neutral-500 hover:text-white flex items-center text-xs space-x-1";
                            subJumpBtn.title = "Jump to subtopic";
                            subJumpBtn.innerHTML = `
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="3" y1="6" x2="21" y2="6"></line>
                                    <line x1="3" y1="12" x2="15" y2="12"></line>
                                    <line x1="3" y1="18" x2="11" y2="18"></line>
                                    <polyline points="17 14 20 17 23 14"></polyline>
                                </svg>
                            `;
                            subJumpBtn.onclick = async () => {
                                dom.qsInput.value = '';
                                dom.qsClear.classList.add('hidden');
                                dom.pageSearchInput.value = '';
                                dom.pageSearchClear.classList.add('hidden');
                                renderTree(state.pages, dom.pagesTree);

                                await handleFileSelection(fileData);
                                setTimeout(() => {
                                    jumpToAnchor(subAnchorId, '1');
                                    const breadcrumbStr = `Jumped to ${getFileDisplayPath(fileData)} / ${section.title} / ${sub.title}`;
                                    showToast(breadcrumbStr);
                                }, 150);
                            };
                            subActions.appendChild(subJumpBtn);
                        }

                        const subPinBtn = document.createElement('button');
                        subPinBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>';
                        subPinBtn.className = "text-neutral-500 hover:text-white";
                        subPinBtn.onclick = () => pinTopic(displayPath, `${section.title} > ${sub.title}`, `${sub.title}\n\n${rawSubText}`);
                        subActions.appendChild(subPinBtn);

                        const subCopyBtn = document.createElement('button');
                        subCopyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                        subCopyBtn.className = "text-neutral-500 hover:text-white";
                        subCopyBtn.onclick = () => {
                            navigator.clipboard.writeText(`${sub.title}\n\n${rawSubText}`).then(() => showToast(state.translations.toastCopied));
                        };
                        subCopyBtn.style.marginLeft = "6px";
                        subActions.appendChild(subCopyBtn);

                        subHeader.appendChild(subActions);
                        subtopicPanel.appendChild(subHeader);

                        if (subText) {
                            const subContentDiv = document.createElement('div');
                            subContentDiv.className = "text-neutral-300 text-sm leading-relaxed";
                            subContentDiv.innerHTML = subText;
                            subtopicPanel.appendChild(subContentDiv);
                        }

                        mainSectionDiv.appendChild(subtopicPanel);
                    }
                });

                overallWrapper.appendChild(mainSectionDiv);
            });

            container.appendChild(overallWrapper);
            attachLinkListeners(container);
            updateJumpMenuVisibility();
        }

        /* =========================================================
           JUMP TO SECTION
           ========================================================= */
        function updateJumpMenuVisibility() {
            const docVisible = !dom.documentView.classList.contains('hidden');
            const hasContent = dom.documentContent.children.length > 0
                || (state.isSplitView && dom.documentContentSecondary.children.length > 0);
            if (docVisible && hasContent && !dom.qsInput.value) {
                dom.jumpDropdown.style.display = 'block';
                buildJumpMenu();
            } else {
                dom.jumpDropdown.style.display = 'none';
                dom.jumpMenu.classList.remove('open');
                dom.jumpMenu.innerHTML = '';
            }
        }

        function buildJumpMenu() {
            const menu = dom.jumpMenu;
            menu.innerHTML = '';

            const collect = (container, slotLabel, slotColor) => {
                const items = [];
                const sectionNodes = container.querySelectorAll(':scope > .w-full > .panel-stylized, :scope > .w-full > .panel-raw');
                sectionNodes.forEach((sec) => {
                    const h1 = sec.querySelector('h1');
                    if (h1) items.push({ level: 1, title: h1.textContent, id: sec.id, slot: slotLabel, color: slotColor });
                    sec.querySelectorAll(':scope > .subtopic-panel, :scope > .h3-block').forEach(sub => {
                        const h2 = sub.querySelector('h2');
                        const h3 = sub.querySelector('.text-\[11px\]') || sub.querySelector('h3');
                        if (h2) items.push({ level: 2, title: h2.textContent, id: sub.id, slot: slotLabel, color: slotColor });
                        else if (h3) items.push({ level: 3, title: h3.textContent, id: sub.id, slot: slotLabel, color: slotColor });
                    });
                });
                return items;
            };

            const items = [];

            if (state.isSplitView) {
                if (state.splitFile1) {
                    const leftItems = collect(dom.documentContent, '1', '#60a5fa');
                    if (leftItems.length) {
                        const groupLabel = document.createElement('div');
                        groupLabel.className = 'jump-group-label';
                        groupLabel.style.color = '#60a5fa';
                        groupLabel.textContent = '[1] ' + getFileDisplayPath(state.splitFile1);
                        menu.appendChild(groupLabel);
                        leftItems.forEach(it => items.push(it));
                    }
                }
                if (state.splitFile2) {
                    const rightItems = collect(dom.documentContentSecondary, '2', '#34d399');
                    if (rightItems.length) {
                        const groupLabel = document.createElement('div');
                        groupLabel.className = 'jump-group-label';
                        groupLabel.style.color = '#34d399';
                        groupLabel.textContent = '[2] ' + getFileDisplayPath(state.splitFile2);
                        menu.appendChild(groupLabel);
                        rightItems.forEach(it => items.push(it));
                    }
                }
            } else {
                const docItems = collect(dom.documentContent, null, null);
                docItems.forEach(it => items.push(it));
            }

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'jump-group-label';
                empty.textContent = state.translations.jumpNoSections || 'No sections in this document.';
                menu.appendChild(empty);
                return;
            }

            items.forEach(it => {
                const btn = document.createElement('button');
                btn.className = it.level === 1 ? 'lvl-1' : it.level === 2 ? 'lvl-2' : 'lvl-3';
                if (it.slot) {
                    const tag = document.createElement('span');
                    tag.className = 'slot-tag';
                    tag.style.color = it.color;
                    tag.textContent = `[${it.slot}]`;
                    btn.appendChild(tag);
                }
                btn.appendChild(document.createTextNode(it.title));
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menu.classList.remove('open');
                    jumpToAnchor(it.id, it.slot);
                });
                menu.appendChild(btn);
            });
        }

        function jumpToAnchor(id, slot) {
            if (!id) return;

            let scrollRoot = document.getElementById('content-scroll-area');
            if (state.isSplitView) {
                scrollRoot = slot === '2' ? dom.documentContentSecondary : dom.documentContent;
            }

            const target = document.getElementById(id);
            if (!target) return;

            const rootRect = scrollRoot.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            const offset = targetRect.top - rootRect.top + scrollRoot.scrollTop - 12;

            scrollRoot.scrollTo({ top: offset, behavior: 'smooth' });

            const flashClass = target.classList.contains('h3-block') ? 'jump-target-h3' : 'jump-target';
            target.classList.remove('jump-target', 'jump-target-h3');
            void target.offsetWidth;
            target.classList.add(flashClass);
            setTimeout(() => target.classList.remove(flashClass), 1300);
        }

        function pinTopic(path, topic, text) {
            state.pinnedTopics.push({ path, topic, text });
            renderPins();
            showToast(state.translations.toastPinned || "Pinned topic");
        }

        function renderPins() {
            dom.pinsContainer.innerHTML = '';
            if (state.pinnedTopics.length === 0) {
                dom.noPinsMsg.style.display = 'block';
                dom.pinsContainer.appendChild(dom.noPinsMsg);
                return;
            }
            dom.noPinsMsg.style.display = 'none';

            state.pinnedTopics.forEach((pin, index) => {
                const p = document.createElement('div');
                p.className = "bg-[#0a0a0a] border border-neutral-800 rounded p-3 relative group hover:border-neutral-700 transition-colors";

                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                removeBtn.className = "absolute top-2 right-2 text-neutral-600 hover:text-white opacity-0 group-hover:opacity-100 transition-opacity";
                removeBtn.onclick = () => {
                    state.pinnedTopics.splice(index, 1);
                    renderPins();
                };

                const pathEl = document.createElement('div');
                pathEl.className = "text-[10px] text-neutral-500 font-mono mb-1 truncate pr-4";
                pathEl.textContent = pin.path;

                const titleEl = document.createElement('div');
                titleEl.className = "text-sm font-semibold text-white mb-2";
                titleEl.textContent = pin.topic;

                const preview = document.createElement('div');
                preview.className = "text-xs text-neutral-400 line-clamp-3 overflow-hidden";
                preview.textContent = pin.text.replace(/#/g, '').trim();

                p.appendChild(removeBtn);
                p.appendChild(pathEl);
                p.appendChild(titleEl);
                p.appendChild(preview);
                dom.pinsContainer.appendChild(p);
            });
        }

        function attachLinkListeners(container) {
            container.querySelectorAll('.external-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    state.pendingLink = link.href;
                    dom.linkModal.classList.remove('hidden');
                });
            });
        }

        function setupEventListeners() {
            window.addEventListener('click', () => dom.contextMenu.classList.add('hidden'));

            dom.jumpBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                buildJumpMenu();
                dom.jumpMenu.classList.toggle('open');
            });
            window.addEventListener('click', (e) => {
                if (!dom.jumpDropdown.contains(e.target)) {
                    dom.jumpMenu.classList.remove('open');
                }
            });
            dom.jumpMenu.addEventListener('click', (e) => e.stopPropagation());

            dom.ctxOpenLeft.onclick = () => {
                if (!state.contextFile) return;
                state.isSplitView = true;
                dom.toggleSplitViewBtn.classList.add('bg-neutral-800', 'text-white');
                dom.toggleSplitViewBtn.classList.remove('text-neutral-300');
                state.splitFile1 = state.contextFile;
                state.slot1Language = pickLang(state.contextFile);
                renderSplitView();
                renderTree(state.pages, dom.pagesTree);
            };

            dom.ctxOpenRight.onclick = () => {
                if (!state.contextFile) return;
                state.isSplitView = true;
                dom.toggleSplitViewBtn.classList.add('bg-neutral-800', 'text-white');
                dom.toggleSplitViewBtn.classList.remove('text-neutral-300');
                state.splitFile2 = state.contextFile;
                state.slot2Language = pickLang(state.contextFile);
                renderSplitView();
                renderTree(state.pages, dom.pagesTree);
            };

            document.getElementById('dl-doc-txt').onclick = () => {
                if (!state.currentActiveFile && !state.splitFile1 && !state.splitFile2) return showToast(state.translations.toastNoFile);
                const active = state.currentActiveFile || state.splitFile1;
                const lang = state.slot1Language;
                const path = active.paths[lang] || active.paths['English'];
                downloadFile(`${active.title}.txt`, state.fileCache[path]);
            };
            document.getElementById('dl-doc-md').onclick = () => {
                if (!state.currentActiveFile && !state.splitFile1 && !state.splitFile2) return showToast(state.translations.toastNoFile);
                const active = state.currentActiveFile || state.splitFile1;
                const lang = state.slot1Language;
                const path = active.paths[lang] || active.paths['English'];
                downloadFile(`${active.title}.md`, state.fileCache[path]);
            };

            document.getElementById('dl-pins-txt').onclick = () => {
                if (state.pinnedTopics.length === 0) return showToast(state.translations.toastNoPins);
                const content = state.pinnedTopics.map(p => `${p.path} - ${p.topic}\n\n${p.text}`).join('\n\n---\n\n');
                downloadFile('pinned_topics.txt', content);
            };
            document.getElementById('dl-pins-md').onclick = () => {
                if (state.pinnedTopics.length === 0) return showToast(state.translations.toastNoPins);
                const content = state.pinnedTopics.map(p => `<!-- ${p.path} -->\n${p.text}`).join('\n\n---\n\n');
                downloadFile('pinned_topics.md', content);
            };

            dom.pinsBtn.onclick = () => {
                dom.pinsSidebar.classList.toggle('hidden');
            };

            dom.qsInput.addEventListener('input', (e) => {
                dom.qsClear.classList.toggle('hidden', e.target.value === '');
                executeGlobalSearch(e.target.value);
            });
            dom.qsClear.onclick = () => {
                dom.qsInput.value = '';
                dom.qsClear.classList.add('hidden');
                if (state.currentActiveFile) handleFileSelection(state.currentActiveFile);
                else renderDashboard();
            };

            dom.pageSearchInput.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                dom.pageSearchClear.classList.toggle('hidden', val === '');
                const filtered = state.pages.filter(p =>
                    p.title.toLowerCase().includes(val) ||
                    p.category.toLowerCase().includes(val));
                renderTree(filtered, dom.pagesTree);
            });
            dom.pageSearchClear.onclick = () => {
                dom.pageSearchInput.value = '';
                dom.pageSearchClear.classList.add('hidden');
                renderTree(state.pages, dom.pagesTree);
            };

            dom.linkCancel.onclick = () => {
                dom.linkModal.classList.add('hidden');
                state.pendingLink = '';
            };
            dom.linkOkay.onclick = () => {
                dom.linkModal.classList.add('hidden');
                if (state.pendingLink) window.open(state.pendingLink, '_blank');
            };

            dom.toggleSplitViewBtn.onclick = () => {
                state.isSplitView = !state.isSplitView;
                if (state.isSplitView) {
                    dom.toggleSplitViewBtn.classList.add('bg-neutral-800', 'text-white');
                    dom.toggleSplitViewBtn.classList.remove('text-neutral-300');
                    if (state.currentActiveFile && !state.splitFile1) {
                        state.splitFile1 = state.currentActiveFile;
                        state.slot1Language = pickLang(state.currentActiveFile);
                    }
                    renderSplitView();
                } else {
                    dom.toggleSplitViewBtn.classList.remove('bg-neutral-800', 'text-white');
                    dom.toggleSplitViewBtn.classList.add('text-neutral-300');
                    state.splitFile1 = null;
                    state.splitFile2 = null;
                    if (state.currentActiveFile) {
                        handleFileSelection(state.currentActiveFile);
                    } else {
                        renderDashboard();
                    }
                }
                renderTree(state.pages, dom.pagesTree);
            };

            dom.viewModeSelect.addEventListener('change', (e) => {
                state.viewMode = e.target.value;
                if (dom.qsInput.value) executeGlobalSearch(dom.qsInput.value);
                else if (state.isSplitView) renderSplitView();
                else if (state.currentActiveFile) handleFileSelection(state.currentActiveFile);
            });

            document.getElementById('ui-language-select').addEventListener('change', (e) => {
                state.uiLanguage = e.target.value;
                loadLanguage(state.uiLanguage);
            });
        }

        init();
    </script>
</body>
</html>
