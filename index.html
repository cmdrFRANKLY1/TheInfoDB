<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Search</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen font-sans antialiased text-slate-900 dark:text-slate-100 transition-colors duration-300 relative overflow-x-hidden">

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="fixed top-6 right-6 z-50 p-2.5 rounded-full bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-slate-100 border border-slate-200 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-500 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm" aria-label="Toggle Dark Mode">
        <!-- Sun Icon for Dark Mode -->
        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden dark:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <!-- Moon Icon for Light Mode -->
        <svg id="theme-toggle-dark-icon" class="w-5 h-5 block dark:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <!-- Dynamic Container for the search bar (uses absolute positioning for transitions) -->
    <div id="search-container" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl px-6 transition-all duration-500 ease-in-out opacity-100 z-40">
        
        <!-- The Search Bar wrapper -->
        <div class="relative flex items-center w-full h-14 rounded-full bg-white dark:bg-slate-800 overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm focus-within:shadow-md focus-within:ring-2 focus-within:ring-indigo-500/50 transition-all duration-300">
            
            <!-- Search Icon -->
            <div class="absolute left-4 flex items-center justify-center text-slate-400 dark:text-slate-500 pointer-events-none">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>

            <!-- Search Input Field -->
            <input
                class="w-full h-full bg-transparent outline-none text-base text-slate-700 dark:text-slate-200 pl-12 pr-6 placeholder-slate-400 dark:placeholder-slate-500"
                type="text"
                id="search"
                placeholder="Search registry files..." 
                autocomplete="off"
            /> 
            
        </div>

    </div>

    <!-- Search Results Container -->
    <!-- pt-32 ensures the results render below the fixed top search bar without overlapping -->
    <div id="results-container" class="w-full max-w-4xl mx-auto pt-32 px-6 pb-12 opacity-0 transition-opacity duration-700 hidden z-10">
        <div class="flex justify-between items-center mb-6">
            <h2 id="results-header" class="text-xl font-semibold text-slate-900 dark:text-white hidden">Search Results</h2>
            
            <!-- View Toggle -->
            <div id="view-toggle" class="hidden flex bg-slate-100 dark:bg-slate-800 rounded-lg p-1 border border-slate-200 dark:border-slate-700 shadow-sm">
                <button id="view-list" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm flex items-center gap-2" aria-label="List View">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    List
                </button>
                <button id="view-details" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center gap-2" aria-label="Details View">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    Details
                </button>
            </div>
        </div>
        <div id="results-list" class="space-y-4">
            <!-- Results will be injected here dynamically -->
        </div>
    </div>

    <!-- Script to handle dark mode toggle and search logic -->
    <script>
        // 1. Dark Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
        });

        // 2. Search Logic
        const searchInput = document.getElementById('search');
        const searchContainer = document.getElementById('search-container');
        const resultsContainer = document.getElementById('results-container');
        const resultsList = document.getElementById('results-list');
        const resultsHeader = document.getElementById('results-header');
        
        // View Toggle Elements
        const viewToggle = document.getElementById('view-toggle');
        const btnList = document.getElementById('view-list');
        const btnDetails = document.getElementById('view-details');

        let globalSearchResults = [];
        let currentQuery = '';
        let currentView = 'list'; // default view

        // Toggle UI Update
        function updateToggleUI() {
            if (currentView === 'list') {
                btnList.className = 'px-3 py-1.5 text-sm font-medium rounded-md transition-colors bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm flex items-center gap-2';
                btnDetails.className = 'px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center gap-2';
            } else {
                btnDetails.className = 'px-3 py-1.5 text-sm font-medium rounded-md transition-colors bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm flex items-center gap-2';
                btnList.className = 'px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center gap-2';
            }
        }

        btnList.addEventListener('click', () => {
            currentView = 'list';
            updateToggleUI();
            renderResults();
        });

        btnDetails.addEventListener('click', () => {
            currentView = 'details';
            updateToggleUI();
            renderResults();
        });

        // Safe DOM Highlighting (avoids breaking HTML tags generated by Markdown)
        function highlightTextInElement(element, query) {
            if (!query) return;
            const regex = new RegExp(`(${query})`, 'gi');
            
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let nodesToReplace = [];
            let node;
            while(node = walker.nextNode()) {
                if (node.nodeValue.match(regex) && node.parentElement.tagName !== 'SCRIPT' && node.parentElement.tagName !== 'STYLE') {
                    nodesToReplace.push(node);
                }
            }
            
            nodesToReplace.forEach(node => {
                const fragment = document.createDocumentFragment();
                const parts = node.nodeValue.split(regex);
                parts.forEach(part => {
                    if (part.toLowerCase() === query.toLowerCase()) {
                        const span = document.createElement('span');
                        span.className = 'bg-amber-200 dark:bg-amber-700/60 text-slate-900 dark:text-slate-100 font-bold px-1 rounded-sm';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // Render Function
        function renderResults() {
            resultsList.innerHTML = '';
            resultsHeader.classList.remove('hidden');
            resultsContainer.classList.remove('hidden');
            viewToggle.classList.remove('hidden');
            
            if (globalSearchResults.length === 0) {
                viewToggle.classList.add('hidden');
                resultsList.innerHTML = `
                    <div class="p-8 text-center bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <p class="text-slate-500 dark:text-slate-400">No results found for "${currentQuery}".</p>
                    </div>
                `;
            } else if (globalSearchResults[0].error) {
                viewToggle.classList.add('hidden');
                resultsList.innerHTML = `
                    <div class="p-6 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl border border-red-100 dark:border-red-900/50">
                        <p>${globalSearchResults[0].message}</p>
                    </div>
                `;
            } else {
                globalSearchResults.forEach((res, index) => {
                    const cardId = `result-card-${index}`;
                    let contentHTML = '';

                    if (currentView === 'details') {
                        // Render full content
                        if (res.tool.path.endsWith('.md')) {
                            // Use marked for markdown formatting and Tailwind prose for styling
                            const parsedMd = marked.parse(res.fullText);
                            contentHTML = `<div class="prose prose-slate dark:prose-invert max-w-none prose-sm sm:prose-base overflow-x-auto">${parsedMd}</div>`;
                        } else {
                            // Plain text/CSV fallback
                            contentHTML = `<pre class="whitespace-pre-wrap text-sm text-slate-700 dark:text-slate-300 font-mono bg-slate-50 dark:bg-slate-900/50 p-4 rounded-lg overflow-x-auto">${res.fullText}</pre>`;
                        }
                    } else {
                        // Render brief list snippet
                        contentHTML = `<p class="text-slate-700 dark:text-slate-300 leading-relaxed text-sm snippet-container">${res.snippet}</p>`;
                    }

                    resultsList.innerHTML += `
                        <div id="${cardId}" class="p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-sm hover:shadow-md transition-shadow border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div class="flex items-center gap-3 mb-4">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300">
                                    ${res.tool.categoryTag}
                                </span>
                                <h3 class="text-lg font-medium text-slate-900 dark:text-white">${res.tool.name}</h3>
                            </div>
                            <!-- Removed file path display -->
                            <div class="content-wrapper">
                                ${contentHTML}
                            </div>
                        </div>
                    `;
                });

                // Apply highlighting after rendering HTML to avoid breaking table tags
                globalSearchResults.forEach((res, index) => {
                    const card = document.getElementById(`result-card-${index}`);
                    if (card) {
                        highlightTextInElement(card.querySelector('.content-wrapper'), currentQuery);
                    }
                });
            }
        }

        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                currentQuery = searchInput.value.trim().toLowerCase();
                
                // 1. Fade out search bar
                searchContainer.classList.remove('opacity-100');
                searchContainer.classList.add('opacity-0');
                
                // Hide old results if performing another search
                resultsContainer.classList.remove('opacity-100');
                resultsContainer.classList.add('opacity-0');

                // 2. Fetch registry and search files concurrently
                globalSearchResults = [];
                try {
                    const regRes = await fetch('registry_2.json');
                    if (regRes.ok) {
                        const registry = await regRes.json();
                        if (registry.tools && Array.isArray(registry.tools)) {
                            
                            const filePromises = registry.tools.map(async (tool) => {
                                try {
                                    const fileRes = await fetch(tool.path);
                                    if (fileRes.ok) {
                                        const text = await fileRes.text();
                                        const matchesText = text.toLowerCase().includes(currentQuery);
                                        const matchesMeta = tool.name.toLowerCase().includes(currentQuery) || (tool.categoryTag && tool.categoryTag.toLowerCase().includes(currentQuery));
                                        
                                        if (matchesText || matchesMeta) {
                                            
                                            // Extract a relevant text snippet for list view
                                            const index = matchesText ? text.toLowerCase().indexOf(currentQuery) : 0;
                                            const start = Math.max(0, index - 80);
                                            const end = Math.min(text.length, index + currentQuery.length + 80);
                                            let snippet = text.substring(start, end);
                                            
                                            if (start > 0) snippet = '...' + snippet;
                                            if (end < text.length) snippet = snippet + '...';
                                            
                                            // Strip out markdown formatting characters for a cleaner short snippet
                                            snippet = snippet.replace(/[\#\*\_\|`]/g, ' ').trim();

                                            globalSearchResults.push({
                                                tool: tool,
                                                fullText: text,
                                                snippet: snippet
                                            });
                                        }
                                    }
                                } catch (err) {
                                    console.error(`Error fetching ${tool.path}:`, err);
                                }
                            });
                            
                            // Wait for all fetches to finish
                            await Promise.all(filePromises);
                        }
                    } else {
                        throw new Error("registry_2.json not found");
                    }
                } catch (error) {
                    console.warn("Fetch blocked by CORS or file missing. Using built-in demo data:", error);
                    
                    // Built-in Demo Fallback so the app works without a local web server
                    const mockRegistry = {
                        "version": "2.0",
                        "tools": [
                            { "name": "Tailscale", "path": "resources/tailscale/tailscale.csv", "categoryTag": "tailscale" },
                            { "name": "SQL", "path": "resources/sql/sql.md", "categoryTag": "sql" }
                        ]
                    };

                    const mockFiles = {
                        "resources/sql/sql.md": "# SQL Commands\n\n| Command | Description |\n| --- | --- |\n| SELECT * FROM table_name; | Retrieve all columns and rows from a specified table. |\n| SELECT column1, column2 FROM table_name WHERE condition; | Retrieve specific columns from a table matching a condition. |\n| INSERT INTO table_name (col1, col2) VALUES (val1, val2); | Insert new rows into a database table. |\n| UPDATE table_name SET col1 = val1 WHERE condition; | Modify existing records in a table. |\n| DELETE FROM table_name WHERE condition; | Delete existing records from a table. |\n| CREATE TABLE table_name (col1 datatype, col2 datatype); | Create a new table in the database. |\n| DROP TABLE table_name; | Delete an entire table and its data from the database. |\n| ALTER TABLE table_name ADD col_name datatype; | Modify an existing table structure (e.g., add a column). |\n| SELECT DISTINCT column_name FROM table_name; | Return only distinct (unique) values in a query result. |\n| SELECT * FROM table_name ORDER BY column_name ASC; | Sort query results in ascending (or descending with DESC) order. |\n| SELECT COUNT(*) FROM table_name; | Count the number of rows matching a query. |\n| SELECT col, SUM(col2) FROM table_name GROUP BY col; | Group rows sharing a property to perform aggregate functions. |\n| SELECT * FROM t1 JOIN t2 ON t1.id = t2.id; | Combine rows from two or more tables based on a related column. |\n| BEGIN TRANSACTION; | Start a new database transaction. |\n| COMMIT; | Save all changes made during the current transaction. |\n| ROLLBACK; | Undo changes made during the current transaction in case of an error. |",
                        "resources/tailscale/tailscale.csv": "Node,IP,Status,Notes\nMacBook-Pro,100.99.98.97,Active,Install: brew install tailscale\nLinux-Server,100.101.102.103,Active,Install: sudo pacman -S tailscale\nWindows-Desktop,100.80.80.80,Offline,Install: choco install tailscale"
                    };

                    mockRegistry.tools.forEach(tool => {
                        const text = mockFiles[tool.path] || "";
                        const matchesText = text.toLowerCase().includes(currentQuery);
                        const matchesMeta = tool.name.toLowerCase().includes(currentQuery) || (tool.categoryTag && tool.categoryTag.toLowerCase().includes(currentQuery));
                        
                        if (matchesText || matchesMeta) {
                            const index = matchesText ? text.toLowerCase().indexOf(currentQuery) : 0;
                            const start = Math.max(0, index - 80);
                            const end = Math.min(text.length, index + currentQuery.length + 80);
                            let snippet = text.substring(start, end);
                            
                            if (start > 0) snippet = '...' + snippet;
                            if (end < text.length) snippet = snippet + '...';
                            
                            // Strip out markdown formatting characters for a cleaner short snippet
                            snippet = snippet.replace(/[\#\*\_\|`]/g, ' ').trim();

                            globalSearchResults.push({
                                tool: tool,
                                fullText: text,
                                snippet: snippet
                            });
                        }
                    });
                }

                // 3. Move search bar to top & fade everything back in
                setTimeout(() => {
                    // Reposition search container
                    searchContainer.classList.remove('top-1/2', '-translate-y-1/2');
                    searchContainer.classList.add('top-8', 'translate-y-0');
                    
                    renderResults();

                    // Fade back in slightly after rendering to ensure transitions work smoothly
                    setTimeout(() => {
                        searchContainer.classList.remove('opacity-0');
                        searchContainer.classList.add('opacity-100');
                        
                        resultsContainer.classList.remove('opacity-0');
                        resultsContainer.classList.add('opacity-100');
                    }, 50);

                }, 500); 
            }
        });
    </script>
</body>
</html>
