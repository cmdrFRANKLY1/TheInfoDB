<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theInfoDB</title>

    <style>
        :root {
            /* Color Palette - Light (Default) */
            --bg-primary: #ffffff;
            --bg-secondary: #f4f4f4;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --hover-bg: #eaeaea;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

            /* Sizing - Medium (Default) */
            --sidebar-width: 246px;
            --sidebar-icon-width: 64px;
            --sidebar-padding: 12px;
            --btn-left: 12px;
            --font-size: 16px;
            --icon-size: 20px;
            --btn-size: 40px;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }

        [data-size="small"] {
            --sidebar-width: 200px;
            --sidebar-icon-width: 54px;
            --sidebar-padding: 9px;
            --btn-left: 11px;
            --font-size: 14px;
            --icon-size: 16px;
            --btn-size: 32px;
        }

        [data-size="large"] {
            --sidebar-width: 300px;
            --sidebar-icon-width: 74px;
            --sidebar-padding: 15px;
            --btn-left: 13px;
            --font-size: 18px;
            --icon-size: 24px;
            --btn-size: 48px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: var(--font-size);
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Toggle Button */
        #sidebar-toggle {
            position: fixed;
            top: 16px;
            left: var(--btn-left);
            height: var(--btn-size);
            min-width: var(--btn-size);
            padding: 0 calc(var(--btn-size) * 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 50;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        #sidebar-toggle:hover {
            background-color: var(--hover-bg);
        }

        #sidebar-toggle.is-open {
            background-color: transparent;
        }

        #sidebar-toggle svg {
            width: var(--icon-size);
            height: var(--icon-size);
            flex-shrink: 0;
        }

        #datetime-display {
            display: none;
            font-size: 0.9em;
            color: var(--text-secondary);
            white-space: nowrap;
            padding-right: 8px;
        }

        #sidebar-toggle.is-open #datetime-display {
            display: block;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Sidebar Overlay */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background-color: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            z-index: 40;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s ease;
            box-shadow: 10px 0 25px -10px rgba(0,0,0,0.1);
        }

        /* "Full Hide" mode */
        body[data-sidebar-mode="hide"] #sidebar {
            transform: translateX(-100%);
        }
        body[data-sidebar-mode="hide"] #sidebar.is-open {
            transform: translateX(0);
        }

        /* "Icons Only" mode */
        body[data-sidebar-mode="icons"] #sidebar {
            transform: translateX(0);
            width: var(--sidebar-icon-width);
        }
        body[data-sidebar-mode="icons"] #sidebar.is-open {
            width: var(--sidebar-width);
        }

        #sidebar-header-space {
            height: calc(16px + var(--btn-size) + 16px);
            flex-shrink: 0;
        }

        #sidebar-search-container {
            padding: 0 16px 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Canvas Layer */
        #app-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            overflow-y: auto;
            padding-top: calc(16px + var(--btn-size) + 24px);
        }

        /* Sidebar Content */
        #sidebar-content {
            padding-top: 12px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: var(--sidebar-padding);
            padding-right: var(--sidebar-padding);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-primary);
            text-decoration: none;
            transition: background-color 0.2s;
            overflow: hidden;
            white-space: nowrap;
        }
        .sidebar-item:hover {
            background-color: var(--hover-bg);
        }
        .sidebar-item svg {
            width: var(--icon-size);
            height: var(--icon-size);
            flex-shrink: 0;
        }

        .sidebar-item-text {
            transition: opacity 0.2s;
            opacity: 1;
        }

        body[data-sidebar-mode="icons"] #sidebar:not(.is-open) .sidebar-item-text {
            opacity: 0;
            pointer-events: none;
        }

        body[data-sidebar-mode="icons"] #sidebar:not(.is-open) #sidebar-search-container {
            display: none;
        }

        /* Sidebar Footer (Settings & Theme) */
        #sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            flex-shrink: 0;
        }

        body[data-sidebar-mode="icons"] #sidebar:not(.is-open) #sidebar-footer {
            flex-direction: column;
            gap: 16px;
            align-items: center;
            padding: 16px 0;
        }

        #settings-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: var(--font-size);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            white-space: nowrap;
        }
        #settings-btn:hover { background-color: var(--hover-bg); }

        body[data-sidebar-mode="icons"] #sidebar:not(.is-open) #settings-btn-text {
            display: none;
        }

        #theme-toggle {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #theme-toggle:hover { background-color: var(--hover-bg); }

        #theme-toggle svg, #settings-btn svg {
            width: var(--icon-size);
            height: var(--icon-size);
            flex-shrink: 0;
        }

        /* Settings Modal */
        #settings-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.6);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        #settings-overlay.is-visible {
            opacity: 1;
            pointer-events: all;
        }
        #settings-modal {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);
            transform: translateY(20px);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #settings-overlay.is-visible #settings-modal {
            transform: translateY(0);
        }

        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-row label {
            font-weight: 600;
            font-size: 0.9em;
        }
        .settings-row select {
            padding: 8px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: var(--font-size);
            outline: none;
        }
        .settings-row-inline {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .settings-row-inline input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--text-primary);
        }

        #settings-close {
            align-self: flex-end;
            padding: 10px 20px;
            background-color: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: var(--font-size);
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        #settings-close:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body data-theme="dark" data-size="small" data-sidebar-mode="hide">

    <!-- Toggle Button (Floats On Top) -->
    <button id="sidebar-toggle" aria-label="Toggle Sidebar">
        <svg id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <svg id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        <span id="datetime-display"></span>
    </button>

    <!-- Sidebar Overlay -->
    <aside id="sidebar">
        <div id="sidebar-header-space"></div>
        <div id="sidebar-search-container">
            <div style="position: relative; display: flex; align-items: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 10px; width: 14px; height: 14px; color: var(--text-secondary);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="sidebar-search" placeholder="Search modules..." style="width: 100%; padding: 8px 8px 8px 30px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-secondary); color: var(--text-primary); outline: none; font-size: 0.9em; transition: opacity 0.2s;">
            </div>
        </div>
        <div id="sidebar-content">
            <!-- External modules inject links here -->
        </div>

        <div id="sidebar-footer">
            <button id="settings-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span id="settings-btn-text">Settings</span>
            </button>
            <button id="theme-toggle" title="Toggle Light/Dark Mode">
                <svg id="icon-sun" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </aside>

    <!-- Main Empty Canvas -->
    <main id="app-canvas">
        <!-- Rendered completely empty for module injections -->
    </main>

    <!-- Settings Modal -->
    <div id="settings-overlay">
        <div id="settings-modal">
            <h2 style="margin-bottom: 8px;">Settings</h2>

            <div class="settings-row">
                <label>Sidebar Toggle Mode</label>
                <select id="setting-sidebar-mode">
                    <option value="hide">Full Hide / Overlay</option>
                    <option value="icons">Icons Only / Expand</option>
                </select>
            </div>

            <div class="settings-row">
                <label>UI Scale</label>
                <select id="setting-ui-scale">
                    <option value="small" selected>Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>

            <div class="settings-row-inline">
                <input type="checkbox" id="setting-auto-close" checked>
                <label for="setting-auto-close">Auto-close Sidebar</label>
            </div>

            <div class="settings-row-inline" style="margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border-color);">
                <input type="checkbox" id="setting-debug-mode">
                <label for="setting-debug-mode" style="font-weight: 600;">Debug Mode</label>
            </div>

            <!-- Container for external modules to add settings -->
            <div id="dynamic-settings-container" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;"></div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px;">
                <button id="settings-cancel" style="padding: 8px 16px; background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9em; transition: opacity 0.2s;">Cancel</button>
                <button id="settings-apply" style="padding: 8px 16px; background-color: var(--text-primary); color: var(--bg-primary); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9em; transition: opacity 0.2s;">Apply</button>
            </div>
        </div>
    </div>

    <script>
        // ─────────────────────────────────────────────────────────────
        // Global configuration shared with dynamically-loaded modules
        // ─────────────────────────────────────────────────────────────
        window.__APP_CONFIG__ = {
            github: {
                owner:  'cmdrFRANKLY1',
                repo:   'TheInfoDB_Data',
                branch: 'main'
            },
            // Cache-busting version token for jsDelivr. Bump this whenever
            // you push changes to any module and jsDelivr keeps serving the
            // old copy. It's cheap and reliable.
            assetVersion: 'v' + Date.now(),
            // Optional: set a GitHub PAT here (fine-grained, read-only on
            // this repo) to raise API rate limits from 60/hr to 5000/hr.
            // Leave null to use unauthenticated requests.
            githubToken: null
        };
        window.__GITHUB_TOKEN__ = window.__APP_CONFIG__.githubToken || null;

        // ─────────────────────────────────────────────────────────────
        // Shared helpers used by dynamically-loaded modules
        // ─────────────────────────────────────────────────────────────

        // Resolve a repo-relative path to a jsDelivr CDN URL that points at
        // the module's source on GitHub. This lets the search module fetch
        // things like `resources/index/titles/indexTitle.json` regardless
        // of where the page itself is hosted (Vercel, localhost, etc.).
        window.resolveUrl = function (relPath) {
            if (!relPath) return '';
            if (/^(https?:)?\/\//i.test(relPath)) return relPath;
            const cfg = window.__APP_CONFIG__.github;
            const clean = String(relPath).replace(/^\/+/, '');
            return `https://cdn.jsdelivr.net/gh/${cfg.owner}/${cfg.repo}@${cfg.branch}/${clean}`;
        };

        window.escapeHtml = function (s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        window.pickRandom = function (arr) {
            if (!Array.isArray(arr) || arr.length === 0) return '';
            return arr[Math.floor(Math.random() * arr.length)];
        };

        window.safeFetchJson = async function (url) {
            try {
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) return null;
                return await res.json();
            } catch {
                return null;
            }
        };

        window.safeFetchText = async function (url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                return await res.text();
            } catch {
                return null;
            }
        };

        // Global app state object shared with modules. Modules extend it.
        window.__appState = window.__appState || {
            indexedPages: [],
            hierarchicalStructure: [],
            pins: []
        };

        // ─────────────────────────────────────────────────────────────
        // UI State
        // ─────────────────────────────────────────────────────────────
        let isSidebarOpen = false;
        let autoClose = true;
        let debugMode = false;

        const body = document.body;
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const iconMenu = document.getElementById('icon-menu');
        const iconClose = document.getElementById('icon-close');
        const datetimeDisplay = document.getElementById('datetime-display');
        const appCanvas = document.getElementById('app-canvas');

        const sidebarSearch = document.getElementById('sidebar-search');

        const settingsBtn = document.getElementById('settings-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsCancel = document.getElementById('settings-cancel');
        const settingsApply = document.getElementById('settings-apply');
        const themeToggle = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        // Fast Date/Time Update Engine
        function updateDateTime() {
            const now = new Date();
            const dateOpts = { weekday: 'short', month: 'short', day: 'numeric' };
            const timeOpts = { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };

            datetimeDisplay.textContent = `${now.toLocaleDateString(undefined, dateOpts)} ${now.toLocaleTimeString(undefined, timeOpts)}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Overlay Toggle Mechanics
        function toggleSidebar(forcedState) {
            isSidebarOpen = forcedState !== undefined ? forcedState : !isSidebarOpen;

            if (isSidebarOpen) {
                sidebar.classList.add('is-open');
                sidebarToggle.classList.add('is-open');
                iconMenu.style.display = 'none';
                iconClose.style.display = 'block';
            } else {
                sidebar.classList.remove('is-open');
                sidebarToggle.classList.remove('is-open');
                iconMenu.style.display = 'block';
                iconClose.style.display = 'none';
            }
        }

        sidebarToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSidebar();
        });

        // Auto-close interaction hook
        appCanvas.addEventListener('click', () => {
            if (autoClose && isSidebarOpen) toggleSidebar(false);
        });

        // Settings Modal Binding
        const elSidebarMode = document.getElementById('setting-sidebar-mode');
        const elUiScale = document.getElementById('setting-ui-scale');
        const elAutoClose = document.getElementById('setting-auto-close');
        const elDebugMode = document.getElementById('setting-debug-mode');

        settingsBtn.addEventListener('click', () => {
            elSidebarMode.value = body.getAttribute('data-sidebar-mode');
            elUiScale.value = body.getAttribute('data-size');
            elAutoClose.checked = autoClose;
            elDebugMode.checked = debugMode;
            settingsOverlay.classList.add('is-visible');
            if (autoClose) toggleSidebar(false);
        });

        settingsCancel.addEventListener('click', () => {
            settingsOverlay.classList.remove('is-visible');
        });

        settingsApply.addEventListener('click', () => {
            body.setAttribute('data-sidebar-mode', elSidebarMode.value);
            body.setAttribute('data-size', elUiScale.value);
            autoClose = elAutoClose.checked;

            if (debugMode !== elDebugMode.checked) {
                debugMode = elDebugMode.checked;
                document.dispatchEvent(new CustomEvent('debugToggled', { detail: debugMode }));
            }

            // Notify dynamic settings
            const dynamicCheckboxes = document.querySelectorAll('.dynamic-setting-cb');
            dynamicCheckboxes.forEach(cb => {
                if (cb.dataset.changed === 'true') {
                    cb.dataset.changed = 'false';
                    document.dispatchEvent(new CustomEvent(cb.id + '_applied', { detail: cb.checked }));
                }
            });

            settingsOverlay.classList.remove('is-visible');
        });

        // Sidebar Search Mechanics
        sidebarSearch.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach(item => {
                const textEl = item.querySelector('.sidebar-item-text');
                const text = textEl ? textEl.textContent.toLowerCase() : '';
                item.style.display = text.includes(term) ? 'flex' : 'none';
            });
        });

        // Theme Toggle
        function toggleTheme() {
            const current = body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);

            if (next === 'light') {
                iconSun.style.display = 'none';
                iconMoon.style.display = 'block';
            } else {
                iconSun.style.display = 'block';
                iconMoon.style.display = 'none';
            }
        }
        themeToggle.addEventListener('click', toggleTheme);

        // ─────────────────────────────────────────────────────────────
        // Core API exposed to modules
        // ─────────────────────────────────────────────────────────────
        window.CoreUI = {
            addSidebarItem: function(id, label, svgIconPath, onClickCallback) {
                const content = document.getElementById('sidebar-content');
                const el = document.createElement('div');
                el.className = 'sidebar-item';
                el.id = id;
                el.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        ${svgIconPath}
                    </svg>
                    <span class="sidebar-item-text">${label}</span>
                `;
                el.addEventListener('click', () => {
                    onClickCallback();
                    if (autoClose) toggleSidebar(false);
                });
                content.appendChild(el);
                return el;
            },
            getCanvas: function() {
                return document.getElementById('app-canvas');
            },
            clearCanvas: function() {
                document.getElementById('app-canvas').innerHTML = '';
            },
            isDebugMode: function() {
                return debugMode;
            },
            addSettingToggle: function(id, label, defaultState, onChangeCallback) {
                const container = document.getElementById('dynamic-settings-container');
                const row = document.createElement('div');
                row.className = 'settings-row-inline';
                row.id = 'setting-container-' + id;
                row.innerHTML = `
                    <input type="checkbox" id="${id}" class="dynamic-setting-cb" ${defaultState ? 'checked' : ''} style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--text-primary);">
                    <label for="${id}">${label}</label>
                `;

                const cb = row.querySelector('input');
                cb.addEventListener('change', () => {
                    cb.dataset.changed = 'true';
                });

                document.addEventListener(id + '_applied', (e) => {
                    if (onChangeCallback) onChangeCallback(e.detail);
                });

                container.appendChild(row);
                return row;
            }
        };

        // ─────────────────────────────────────────────────────────────
        // Module bootstrap
        //
        // Strategy: fetch a tiny manifest from raw.githubusercontent.com
        // (no per-IP API rate limit for public repos) listing every module
        // entry script. Fall back to a hardcoded local module if the fetch
        // fails (offline dev, or repo structure changed).
        //
        // Each module is then loaded from jsDelivr with a cache-busting
        // query string, so updates to module source are picked up on the
        // next page load instead of after jsDelivr's 12-hour TTL.
        // ─────────────────────────────────────────────────────────────

        // Optional manifest format (any of these shapes works):
        //   { "modules": ["modules/search/search.js", "modules/pins/pins.js"] }
        //   { "modules": [{ "path": "modules/search/search.js" }, ...] }
        //   ["modules/search/search.js", ...]
        //
        // If you don't want to maintain a manifest file, leave MODULE_MANIFEST_URL
        // null and instead set the MANUAL_MODULE_LIST below.
        const MODULE_MANIFEST_URL = null; // e.g. 'resources/manifest/modules.json'
        const MANUAL_MODULE_LIST = [
            'modules/search/search.js'
        ];

        function buildCdnUrl(repoPath) {
            const cfg = window.__APP_CONFIG__.github;
            const clean = String(repoPath).replace(/^\/+/, '');
            return `https://cdn.jsdelivr.net/gh/${cfg.owner}/${cfg.repo}@${cfg.branch}/${clean}?${window.__APP_CONFIG__.assetVersion}`;
        }

        function loadModuleScript(repoPath) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = buildCdnUrl(repoPath);
                script.onload = () => resolve({ path: repoPath, ok: true });
                script.onerror = (err) => {
                    console.warn(`[Bootstrap] Failed to load ${repoPath}`, err);
                    resolve({ path: repoPath, ok: false });
                };
                document.body.appendChild(script);
            });
        }

        async function resolveModuleList() {
            if (MODULE_MANIFEST_URL) {
                const url = window.resolveUrl(MODULE_MANIFEST_URL);
                const data = await window.safeFetchJson(url);
                if (Array.isArray(data)) return data.filter(x => typeof x === 'string');
                if (data && Array.isArray(data.modules)) {
                    return data.modules
                        .map(m => (typeof m === 'string' ? m : m && m.path))
                        .filter(Boolean);
                }
                console.warn('[Bootstrap] Manifest missing or malformed; falling back to manual list.');
            }
            return MANUAL_MODULE_LIST.slice();
        }

        async function bootstrapModules() {
            try {
                const list = await resolveModuleList();
                if (list.length === 0) {
                    console.warn('[Bootstrap] No modules to load.');
                    return;
                }

                const results = await Promise.all(list.map(loadModuleScript));
                const failed = results.filter(r => !r.ok).map(r => r.path);
                if (failed.length) {
                    console.warn('[Bootstrap] Some modules failed to load:', failed);
                } else {
                    console.info(`[Bootstrap] Loaded ${results.length} module(s).`);
                }
            } catch (e) {
                console.error('[Bootstrap] Fatal:', e);
            }
        }

        window.addEventListener('DOMContentLoaded', bootstrapModules);
    </script>
</body>
</html>
