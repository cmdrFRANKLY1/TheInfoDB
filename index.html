<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theInfoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        discord: {
                            blurple: 'var(--accent-color)',
                            dark: 'var(--bg-primary)',
                            darker: 'var(--bg-secondary)',
                            darkest: 'var(--bg-tertiary)',
                            text_normal: 'var(--text-normal)',
                            interactive_normal: 'var(--interactive-normal)',
                            interactive_hover: 'var(--interactive-hover)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            /* Default Dark Theme */
            --bg-primary: #36393f;
            --bg-secondary: #2f3136;
            --bg-tertiary: #202225;
            --text-normal: #dcddde;
            --text-muted: #72767d;
            --interactive-normal: #b9bbbe;
            --interactive-hover: #dcddde;
            --border-color: rgba(32, 34, 37, 0.5);
            --settings-bg: #36393f;
        }

        .light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: #f2f3f5;
            --bg-tertiary: #e3e5e8;
            --text-normal: #000000;
            --text-muted: #747f8d;
            --interactive-normal: #000000;
            --interactive-hover: #4f545c;
            --border-color: rgba(6, 6, 7, 0.08);
            --settings-bg: #ffffff;
        }

        .midnight-theme {
            --bg-primary: #121212;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #000000;
            --text-normal: #e0e0e0;
            --text-muted: #6b6b6b;
            --interactive-normal: #a3a3a3;
            --interactive-hover: #ffffff;
            --border-color: rgba(255, 255, 255, 0.05);
            --settings-bg: #121212;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-normal);
        }

        body {
            transition: background-color 0.3s, color 0.3s;
            display: flex;
        }

        #sidebar {
            transition: width 0.2s ease-in-out, background-color 0.3s;
            background-color: var(--bg-secondary);
            border-color: var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 52px; /* Starts collapsed. 52px perfectly houses 32px icons + 10px total left padding */
            overflow-x: hidden;
        }

        #sidebar-header {
            border-color: var(--border-color);
        }

        /* Fixed text layout with opacity fade for smooth transition */
        .sidebar-text {
            white-space: nowrap;
            transition: opacity 0.15s ease-in-out;
            opacity: 1;
        }
        
        .collapsed .sidebar-text {
            opacity: 0;
            pointer-events: none;
        }

        #settings-panel {
            background-color: var(--settings-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
            color: var(--text-normal);
            width: 100%;
            max-width: 420px;
        }
        #settings-panel.active { display: block; }

        .setting-row { margin-bottom: 16px; }
        .setting-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .dropdown-select {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-tertiary);
            color: var(--text-normal);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .dropdown-select:focus {
            border-color: var(--accent-color);
        }

        /* Settings Color & Theme Circles */
        .circle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle-btn:hover {
            transform: scale(1.1);
        }
        .circle-btn.selected {
            border-color: var(--text-normal);
            transform: scale(1.1);
        }
        .circle-btn.selected::after {
            content: "\f00c"; /* FontAwesome check */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 12px;
            text-shadow: 0px 0px 4px rgba(0,0,0,0.8);
        }
        .light-theme .circle-btn.selected::after {
            color: black;
            text-shadow: 0px 0px 4px rgba(255,255,255,0.8);
        }

        .custom-color-btn {
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
        }

        .settings-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .btn {
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, filter 0.2s;
        }
        .btn-cancel { background-color: transparent; color: var(--text-normal); }
        .btn-cancel:hover { text-decoration: underline; }
        .btn-apply { background-color: var(--accent-color); color: white; }
        .btn-apply:hover { filter: brightness(1.1); }

        #bottom-area {
            background-color: var(--bg-tertiary);
            padding: 8px 6px; /* perfectly matches entries container padding */
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .sidebar-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 4px; /* leaves exactly 32px inner space for the icon when collapsed */
            gap: 12px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .icon-square {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .sidebar-btn:hover .icon-square,
        #sidebar-header:hover .icon-square {
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Sidebar (Starts Collapsed) -->
    <aside id="sidebar" class="flex-shrink-0 border-r border-discord-dark relative flex flex-col h-full z-20 transition-all duration-200 collapsed">
        <!-- Sidebar Header (Acts as Toggle) -->
        <div id="sidebar-header" class="h-12 border-b flex items-center justify-start pl-[10px] flex-shrink-0 transition-all duration-200 cursor-pointer overflow-hidden" title="Toggle Sidebar">
            <div class="icon-square text-[var(--interactive-normal)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
            </div>
            <span class="sidebar-text font-bold whitespace-nowrap ml-[12px]" style="color: var(--accent-color);">theInfoDB</span>
        </div>
        
        <!-- Dynamic Sidebar Entries Area -->
        <div id="sidebar-entries-container" class="flex-1 overflow-y-auto overflow-x-hidden py-4 px-[6px] flex flex-col gap-1"></div>
        
        <!-- Bottom Area -->
        <div id="bottom-area" class="flex-shrink-0 border-t border-discord-dark transition-all duration-200">
            <button id="settings-btn" class="sidebar-btn text-discord-interactive_normal hover:text-discord-interactive_hover hover:bg-gray-700/50 transition-colors group">
                <div class="icon-square">
                    <i class="fa-solid fa-gear text-lg"></i>
                </div>
                <span class="sidebar-text font-medium text-sm">Settings</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area (Canvas) -->
    <main class="flex-1 bg-discord-dark flex items-center justify-center h-full w-full p-6 relative">
        
        <!-- Module Canvas Space -->
        <div id="app-canvas" class="absolute inset-0 p-6 overflow-auto z-0 text-discord-text_normal">
            <!-- External js modules will populate this area -->
        </div>

        <!-- Settings Panel in Canvas -->
        <div id="settings-panel" class="z-50 relative">
            <h2 class="text-2xl font-bold mb-6">Settings</h2>
            
            <div class="setting-row">
                <span class="setting-label">Sidebar Scale</span>
                <select id="sidebar-scale-select" class="dropdown-select">
                    <option value="small" selected>Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            
            <div class="setting-row mt-6">
                <span class="setting-label">Appearance</span>
                <div class="flex gap-4">
                    <div class="flex flex-col items-center gap-2">
                        <button class="circle-btn theme-btn" data-theme="dark" style="background-color: #36393f;" title="Dark"></button>
                        <span class="text-xs text-[var(--text-muted)]">Dark</span>
                    </div>
                    <div class="flex flex-col items-center gap-2">
                        <button class="circle-btn theme-btn" data-theme="light" style="background-color: #f2f3f5; border: 1px solid #ccc;" title="Light"></button>
                        <span class="text-xs text-[var(--text-muted)]">Light</span>
                    </div>
                    <div class="flex flex-col items-center gap-2">
                        <button class="circle-btn theme-btn" data-theme="midnight" style="background-color: #0a0a0a;" title="Midnight"></button>
                        <span class="text-xs text-[var(--text-muted)]">Midnight</span>
                    </div>
                </div>
            </div>

            <div class="setting-row mt-6">
                <span class="setting-label">Accent Color</span>
                <div class="flex gap-3 flex-wrap">
                    <button class="circle-btn color-btn" data-color="#5865F2" style="background-color: #5865F2;" title="Blurple"></button>
                    <button class="circle-btn color-btn" data-color="#ed4245" style="background-color: #ed4245;" title="Red"></button>
                    <button class="circle-btn color-btn" data-color="#3ba55d" style="background-color: #3ba55d;" title="Green"></button>
                    <button class="circle-btn color-btn" data-color="#fee75c" style="background-color: #fee75c;" title="Yellow"></button>
                    <button class="circle-btn color-btn" data-color="#eb459e" style="background-color: #eb459e;" title="Pink"></button>
                    
                    <div class="flex items-center ml-2 border-l border-[var(--border-color)] pl-3">
                        <button class="circle-btn custom-color-btn color-btn" id="custom-color-trigger" title="Custom Color"></button>
                        <input type="color" id="accent-color-picker" class="opacity-0 absolute w-0 h-0 pointer-events-none">
                    </div>
                </div>
            </div>

            <!-- Dynamic Settings Container -->
            <div id="dynamic-settings-container"></div>

            <div class="settings-footer">
                <button class="btn btn-cancel" id="settings-cancel">Cancel</button>
                <button class="btn btn-apply" id="settings-apply">Apply</button>
            </div>
        </div>
    </main>

    <script>
        window.AppAPI = {
            // 1. Canvas API
            canvas: {
                getContainer: () => document.getElementById('app-canvas'),
                setContent: (htmlOrElement) => {
                    const container = document.getElementById('app-canvas');
                    if (typeof htmlOrElement === 'string') {
                        container.innerHTML = htmlOrElement;
                    } else if (htmlOrElement instanceof HTMLElement) {
                        container.innerHTML = '';
                        container.appendChild(htmlOrElement);
                    }
                }
            },
            
            // 2. Sidebar API
            sidebar: {
                addEntry: (id, text, iconClass, onClick) => {
                    const container = document.getElementById('sidebar-entries-container');
                    const btn = document.createElement('button');
                    btn.className = "sidebar-btn text-discord-interactive_normal hover:text-discord-interactive_hover hover:bg-gray-700/50 transition-colors group";
                    btn.id = `sidebar-item-${id}`;
                    
                    const iconContainer = document.createElement('div');
                    iconContainer.className = "icon-square";
                    
                    const icon = document.createElement('i');
                    icon.className = `${iconClass} text-lg text-center`;
                    
                    iconContainer.appendChild(icon);
                    
                    const label = document.createElement('span');
                    label.className = "sidebar-text font-medium text-sm whitespace-nowrap";
                    label.textContent = text;

                    btn.appendChild(iconContainer);
                    btn.appendChild(label);
                    
                    btn.addEventListener('click', (e) => {
                        onClick(e);
                        // Auto-close sidebar after clicking an entry
                        if (typeof isCollapsed !== 'undefined' && !isCollapsed) {
                            isCollapsed = true;
                            document.getElementById('sidebar').classList.add('collapsed');
                            if (typeof updateSidebarWidth === 'function') updateSidebarWidth();
                        }
                    });
                    container.appendChild(btn);
                    
                    // Auto-adjust width if a new module loads while the sidebar is already expanded
                    if (typeof updateSidebarWidth === 'function') {
                        updateSidebarWidth();
                    }
                    
                    return btn;
                },
                clearEntries: () => {
                    document.getElementById('sidebar-entries-container').innerHTML = '';
                }
            },
            
            // 3. Settings API
            settings: {
                addEntry: (id, labelText, customHtml) => {
                    const container = document.getElementById('dynamic-settings-container');
                    const row = document.createElement('div');
                    row.className = 'setting-row mt-6 pt-4 border-t border-[var(--border-color)]';
                    row.id = `setting-item-${id}`;
                    
                    const label = document.createElement('span');
                    label.className = 'setting-label';
                    label.textContent = labelText;
                    
                    const content = document.createElement('div');
                    content.innerHTML = customHtml;
                    
                    row.appendChild(label);
                    row.appendChild(content);
                    container.appendChild(row);
                }
            },
            
            // 4. Color API
            colors: {
                get: (varName) => {
                    return getComputedStyle(document.body).getPropertyValue(varName).trim();
                },
                set: (varName, value) => {
                    document.documentElement.style.setProperty(varName, value);
                    document.body.style.setProperty(varName, value);
                }
            }
        };

        async function loadModules() {
            try {
                const response = await fetch('modules/registryForModules.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data && Array.isArray(data.files)) {
                    const loadPromises = [];
                    for (const fileUrl of data.files) {
                        console.log(`Loading module: ${fileUrl}`);
                        const p = new Promise((resolve) => {
                            const script = document.createElement('script');
                            script.src = fileUrl;
                            script.async = false; // Maintain execution order
                            script.onload = resolve;
                            script.onerror = () => {
                                console.warn(`Failed to load module script: ${fileUrl}`);
                                resolve();
                            };
                            document.body.appendChild(script);
                        });
                        loadPromises.push(p);
                    }
                    
                    // Wait for all scripts to finish loading
                    await Promise.all(loadPromises);
                    
                    // Auto-start the search module once everything is ready
                    const searchBtn = document.getElementById('sidebar-item-search');
                    if (searchBtn) {
                        searchBtn.click();
                    }
                }
            } catch (error) {
                console.warn('Could not load modules registry. This is expected if running without a local server.', error);
            }
        }

        // Initialize external modules
        loadModules();

        const sidebar = document.getElementById('sidebar');
        const sidebarHeader = document.getElementById('sidebar-header');
        
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsCancel = document.getElementById('settings-cancel');
        const settingsApply = document.getElementById('settings-apply');
        
        const scaleSelect = document.getElementById('sidebar-scale-select');
        const themeBtns = document.querySelectorAll('.theme-btn');
        const colorBtns = document.querySelectorAll('.color-btn');
        const customColorTrigger = document.getElementById('custom-color-trigger');
        const accentPicker = document.getElementById('accent-color-picker');
        
        // Start Collapsed
        let isCollapsed = true;

        // Generate a random hex color on first load
        function getRandomColor() {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        }
        
        const initialAccentColor = getRandomColor();
        applyAccentColor(initialAccentColor);
        
        // Settings State
        let currentSettings = {
            scale: 'small',
            theme: 'dark',
            accentColor: initialAccentColor
        };
        let pendingSettings = { ...currentSettings };

        // Halved the small sidebar to 100px
        const sidebarScales = {
            small: '100px',
            medium: '240px',
            large: '300px'
        };

        function updateSidebarWidth() {
            if (isCollapsed) {
                sidebar.style.width = '52px';
            } else {
                // Temporarily disable transition and set to max-content to accurately measure natural content width
                const oldTransition = sidebar.style.transition;
                sidebar.style.transition = 'none';
                
                const currentWidth = sidebar.style.width;
                sidebar.style.width = 'max-content'; 
                
                // Read the unclipped natural width (added 24px buffer to guarantee text isn't cut off)
                const naturalWidth = sidebar.offsetWidth + 24;
                const scaleWidth = parseInt(sidebarScales[currentSettings.scale]);
                
                // Pick whichever is larger: the chosen scale, or the natural text width
                const finalWidth = Math.max(naturalWidth, scaleWidth);
                
                // Restore width and force browser to process the visual change before animating
                sidebar.style.width = currentWidth;
                sidebar.offsetHeight; 
                
                // Re-enable transition and set final responsive width
                sidebar.style.transition = oldTransition;
                sidebar.style.width = finalWidth + 'px';
            }
        }
        
        // Ensure initial width is synced on load
        updateSidebarWidth();

        // Close sidebar when clicking outside of it
        document.addEventListener('click', (e) => {
            if (!isCollapsed && !sidebar.contains(e.target)) {
                isCollapsed = true;
                sidebar.classList.add('collapsed');
                updateSidebarWidth();
            }
        });

        // Sidebar Toggle Handler (Header Click)
        sidebarHeader.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
            } else {
                sidebar.classList.remove('collapsed');
            }
            updateSidebarWidth();
        });

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
            if (settingsPanel.classList.contains('active')) {
                pendingSettings = { ...currentSettings };
                updateSettingsUI();
            }
            // Auto-close sidebar after clicking Settings
            if (!isCollapsed) {
                isCollapsed = true;
                sidebar.classList.add('collapsed');
                updateSidebarWidth();
            }
        });

        scaleSelect.addEventListener('change', (e) => {
            pendingSettings.scale = e.target.value;
        });

        // Theme Circles Click
        themeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                pendingSettings.theme = e.currentTarget.dataset.theme;
                updateSettingsUI();
            });
        });

        // Color Circles Click
        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (e.currentTarget.id === 'custom-color-trigger') {
                    accentPicker.click();
                } else {
                    pendingSettings.accentColor = e.currentTarget.dataset.color;
                    updateSettingsUI();
                }
            });
        });

        // Custom Color Picker Input
        accentPicker.addEventListener('input', (e) => {
            pendingSettings.accentColor = e.target.value;
            customColorTrigger.style.borderColor = pendingSettings.accentColor;
            updateSettingsUI();
        });

        settingsApply.addEventListener('click', () => {
            currentSettings = { ...pendingSettings };
            applySettings(currentSettings);
            settingsPanel.classList.remove('active');
        });

        settingsCancel.addEventListener('click', () => {
            settingsPanel.classList.remove('active');
            pendingSettings = { ...currentSettings };
            updateSettingsUI();
        });

        function updateSettingsUI() {
            // Update scale dropdown
            scaleSelect.value = pendingSettings.scale;
            
            // Update Theme Circles Selection State
            themeBtns.forEach(btn => {
                if (btn.dataset.theme === pendingSettings.theme) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Update Color Circles Selection State
            let matchedPreset = false;
            colorBtns.forEach(btn => {
                if (btn.id !== 'custom-color-trigger') {
                    if (btn.dataset.color.toLowerCase() === pendingSettings.accentColor.toLowerCase()) {
                        btn.classList.add('selected');
                        matchedPreset = true;
                    } else {
                        btn.classList.remove('selected');
                    }
                }
            });

            // Handle Custom Color Circle state
            if (!matchedPreset) {
                customColorTrigger.classList.add('selected');
                customColorTrigger.style.boxShadow = `0 0 10px ${pendingSettings.accentColor}`;
                customColorTrigger.dataset.color = pendingSettings.accentColor; // Save state
            } else {
                customColorTrigger.classList.remove('selected');
                customColorTrigger.style.boxShadow = 'none';
            }
        }

        function applyAccentColor(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            document.body.style.setProperty('--accent-color', color);
            if(window.AppAPI && window.AppAPI.colors) {
                window.AppAPI.colors.set('--accent-color', color);
            }
        }

        function applySettings(settings) {
            // Apply Scale
            updateSidebarWidth();

            // Apply Accent Color
            applyAccentColor(settings.accentColor);
            
            // Apply Theme
            document.body.classList.remove('light-theme', 'midnight-theme');
            if (settings.theme === 'light') {
                document.body.classList.add('light-theme');
            } else if (settings.theme === 'midnight') {
                document.body.classList.add('midnight-theme');
            }
        }
    </script>
</body>
</html>
