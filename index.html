<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheInfoDB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
            --font-scale: 1;

            --bg-app: #000;
            --bg-panel: #030303;
            --bg-panel-alt: #050505;
            --bg-panel-hover: #0a0a0a;
            --bg-subtle: #080808;
            --bg-neutral-900: #171717;
            --bg-neutral-800: #262626;
            --border-color: #262626;
            --border-subtle: #1a1a1a;
            --border-hover: #333;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #525252;
            --text-heading: #fff;
            --scroll-track: #0a0a0a;
            --scroll-thumb: #333;
            --scroll-thumb-hover: #555;
        }
        * { font-family: var(--font-sans); }
        code, pre, kbd, samp { font-family: var(--font-mono); }

        [data-theme="light"] {
            --bg-app: #ffffff;
            --bg-panel: #fafafa;
            --bg-panel-alt: #f5f5f5;
            --bg-panel-hover: #efefef;
            --bg-subtle: #f0f0f0;
            --bg-neutral-900: #f5f5f5;
            --bg-neutral-800: #e5e5e5;
            --border-color: #e5e5e5;
            --border-subtle: #e5e5e5;
            --border-hover: #d4d4d4;
            --text-primary: #171717;
            --text-secondary: #525252;
            --text-muted: #a3a3a3;
            --text-heading: #0a0a0a;
            --scroll-track: #f0f0f0;
            --scroll-thumb: #ccc;
            --scroll-thumb-hover: #aaa;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-app);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.2s ease, color 0.2s ease;
            font-size: calc(16px * var(--font-scale));
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

        .panel-stylized {
            border: 1px solid var(--border-color);
            background-color: var(--bg-panel-alt);
            border-radius: 0.5rem;
            padding: 1.5rem 1.75rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .panel-stylized:hover { border-color: var(--border-hover); }
        .panel-stylized:last-child { margin-bottom: 0; }

        .subtopic-panel {
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-subtle);
            border-radius: 0.375rem;
            padding: 1.1rem 1.25rem 1rem;
            margin-top: 1rem;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .subtopic-panel:hover {
            border-color: var(--border-hover);
            background-color: var(--bg-panel-hover);
        }

        .h3-block {
            margin-top: 1rem;
            padding-left: 0.9rem;
            border-left: 2px solid var(--border-subtle);
        }

        .panel-raw {
            margin-bottom: 1.5rem;
            padding: 1.25rem 1.5rem;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .tooltip-term {
            border-bottom: 1px dotted var(--text-muted);
            cursor: help;
            position: relative;
        }
        .tooltip-term:hover {
            color: var(--text-heading);
            border-bottom-color: var(--text-heading);
        }
        #global-tooltip {
            position: fixed;
            z-index: 200;
            background: var(--bg-panel-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-hover);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.4;
            max-width: 320px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
        }
        #global-tooltip.show { opacity: 1; }
        [data-theme="light"] #global-tooltip {
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }

        .doc-scope {
            --doc-scale: 1;
        }
        .doc-scope .panel-stylized { font-size: calc(1rem * var(--doc-scale)); }
        .doc-scope .subtopic-panel { font-size: calc(0.875rem * var(--doc-scale)); }
        .doc-scope .h3-block { font-size: calc(0.875rem * var(--doc-scale)); }
        .doc-scope .panel-raw { font-size: calc(0.85rem * var(--doc-scale)); }
        .doc-scope .panel-stylized h1 { font-size: calc(1.5rem * var(--doc-scale)); }
        .doc-scope .subtopic-panel h2 { font-size: calc(1rem * var(--doc-scale)); }
        .doc-scope .text-neutral-300,
        .doc-scope .text-neutral-400,
        .doc-scope .text-neutral-500 { font-size: calc(0.875rem * var(--doc-scale)); }

        .panel-stylized,
        .subtopic-panel {
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.075), 0 1px 4px rgba(255, 255, 255, 0.09);
        }
        .panel-stylized:hover {
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.12), 0 2px 6px rgba(255, 255, 255, 0.1);
        }
        .subtopic-panel:hover {
            box-shadow: 0 4px 22px rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] .panel-stylized,
        [data-theme="light"] .subtopic-panel {
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        [data-theme="light"] .panel-stylized:hover {
            box-shadow: 0 8px 34px rgba(0, 0, 0, 0.24), 0 3px 8px rgba(0, 0, 0, 0.22);
        }
        [data-theme="light"] .subtopic-panel:hover {
            box-shadow: 0 4px 26px rgba(0, 0, 0, 0.22);
        }

        .pages-panel {
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        [data-theme="light"] .pages-panel {
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        .dashboard-card {
            box-shadow: 0 4px 20px rgba(255,255,255,0.075);
        }
        .dashboard-card:hover {
            box-shadow: 0 8px 30px rgba(255,255,255,0.12);
        }
        [data-theme="light"] .dashboard-card {
            box-shadow: 0 4px 22px rgba(0,0,0,0.16), 0 2px 6px rgba(0,0,0,0.2);
        }
        [data-theme="light"] .dashboard-card:hover {
            box-shadow: 0 8px 34px rgba(0,0,0,0.24), 0 3px 8px rgba(0,0,0,0.22);
        }

        .pinned-card {
            box-shadow: 0 3px 14px rgba(255,255,255,0.06);
        }
        [data-theme="light"] .pinned-card {
            box-shadow: 0 3px 14px rgba(0,0,0,0.15), 0 1px 4px rgba(0,0,0,0.18);
        }

        .tree-details > summary {
            list-style: none;
            cursor: pointer;
            padding: 0.15rem 0.3rem;
            border-radius: 0.25rem;
        }
        .tree-details > summary::-webkit-details-marker { display: none; }
        .tree-details > summary:hover { background-color: var(--bg-neutral-900); }
        .tree-details[open] > summary .details-arrow { transform: rotate(90deg); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-heading);
            color: var(--bg-app);
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 100;
        }
        .toast.show { opacity: 1; }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: var(--bg-panel-hover);
            min-width: 120px;
            border: 1px solid var(--border-hover);
            border-radius: 4px;
            z-index: 50;
        }
        .dropdown-content button {
            color: var(--text-heading);
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
        }
        .dropdown-content button:hover { background-color: var(--bg-neutral-900); }
        .dropdown:focus-within .dropdown-content { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; margin-bottom: 0.75rem; }
        th, td { border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; text-align: left; font-size: 0.875rem; }
        th { background-color: var(--bg-neutral-900); color: var(--text-heading); }
        ul, ol { padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        li { margin-bottom: 0.25rem; }

        .split-column {
            flex: 1;
            min-width: 0;
            height: 100%;
            overflow-y: auto;
            padding-right: 0.5rem;
            padding-bottom: 1rem;
            overscroll-behavior: contain;
        }
        .column-header {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-app);
            backdrop-filter: blur(6px);
        }
        [data-theme="dark"] .column-header { background: rgba(0,0,0,0.9); }
        [data-theme="light"] .column-header { background: rgba(255,255,255,0.9); }

        .split-divider {
            width: 1px;
            background: var(--border-color);
            margin: 1rem 0;
            flex-shrink: 0;
            align-self: stretch;
        }
        @media (max-width: 767px) {
            .split-divider { display: none; }
        }

        .hover-actions {
            opacity: 0;
            transition: opacity 0.15s ease;
            display: flex;
            gap: 0.6rem;
            flex-shrink: 0;
        }
        .group:hover > * > .hover-actions,
        .group:hover > .hover-actions,
        .group:hover .hover-actions { opacity: 1; }

        #content-scroll-area.split-active {
            overflow: hidden;
            padding: 1.25rem 1.5rem;
        }
        #content-scroll-area.split-active #document-view { height: 100%; }
        #content-scroll-area.split-active #document-layout { height: 100%; }

        @media (min-width: 1600px) {
            #content-scroll-area { padding-left: 3rem; padding-right: 3rem; }
            #content-scroll-area.split-active { padding-left: 2rem; padding-right: 2rem; }
        }

        #jump-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 320px;
            max-width: 480px;
            max-height: 480px;
            overflow-y: auto;
            background: var(--bg-panel-hover);
            border: 1px solid var(--border-hover);
            border-radius: 6px;
            z-index: 60;
            padding: 6px 0;
        }
        #jump-menu.open { display: block; }
        #jump-menu .jump-group-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 6px 12px 4px;
        }
        #jump-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #jump-menu button:hover { background: var(--bg-neutral-900); color: var(--text-heading); }
        #jump-menu button.lvl-1 { font-weight: 600; color: var(--text-heading); }
        #jump-menu button.lvl-2 { padding-left: 24px; }
        #jump-menu button.lvl-3 { padding-left: 36px; color: var(--text-secondary); font-size: 11px; }
        #jump-menu button .slot-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
        }

        @keyframes jumpFlash {
            0%   { background-color: rgba(128,128,128,0.18); border-color: var(--text-muted); }
            100% { background-color: transparent; border-color: inherit; }
        }
        .jump-target, .jump-target-h3 {
            animation: jumpFlash 1.2s ease-out;
        }

        .file-actions button {
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            min-height: 18px;
        }

        .doc-action-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .doc-action-btn > svg {
            width: 14px;
            height: 14px;
            display: block;
        }

        .toolbar-select {
            background: transparent;
            border: 1px solid var(--border-hover);
            color: var(--text-heading);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 12px;
            outline: none;
            max-width: 130px;
        }
        .toolbar-select option { background: var(--bg-panel); color: var(--text-heading); }

        .pins-scroll-area {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 0.5rem 0.75rem 0.75rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        [data-theme="light"] .bg-black { background-color: var(--bg-app) !important; }
        [data-theme="light"] .bg-\[\#030303\] { background-color: var(--bg-panel) !important; }
        [data-theme="light"] .bg-\[\#050505\] { background-color: var(--bg-panel-alt) !important; }
        [data-theme="light"] .bg-\[\#0a0a0a\] { background-color: var(--bg-panel-hover) !important; }
        [data-theme="light"] .bg-\[\#080808\] { background-color: var(--bg-subtle) !important; }
        [data-theme="light"] .bg-\[\#111\] { background-color: var(--bg-panel-alt) !important; }
        [data-theme="light"] .bg-neutral-900 { background-color: var(--bg-neutral-900) !important; }
        [data-theme="light"] .bg-neutral-800 { background-color: var(--bg-neutral-800) !important; }
        [data-theme="light"] .border-neutral-800 { border-color: var(--border-color) !important; }
        [data-theme="light"] .border-neutral-700 { border-color: var(--border-hover) !important; }
        [data-theme="light"] .border-neutral-900 { border-color: var(--border-subtle) !important; }
        [data-theme="light"] .border-neutral-800\/60 { border-color: rgba(0,0,0,0.08) !important; }
        [data-theme="light"] .text-white { color: var(--text-heading) !important; }
        [data-theme="light"] .text-neutral-300 { color: var(--text-primary) !important; }
        [data-theme="light"] .text-neutral-400 { color: var(--text-secondary) !important; }
        [data-theme="light"] .text-neutral-500 { color: var(--text-muted) !important; }
        [data-theme="light"] .text-neutral-600 { color: #737373 !important; }
        [data-theme="light"] .hover\:bg-neutral-900:hover { background-color: var(--bg-neutral-900) !important; }
        [data-theme="light"] .hover\:bg-neutral-800:hover { background-color: var(--bg-neutral-800) !important; }
        [data-theme="light"] .hover\:text-white:hover { color: var(--text-heading) !important; }
        [data-theme="light"] .hover\:border-neutral-700:hover { border-color: var(--border-hover) !important; }
        [data-theme="light"] .hover\:text-neutral-400:hover { color: var(--text-secondary) !important; }
        [data-theme="light"] .bg-white { background-color: #171717 !important; }
        [data-theme="light"] .bg-white:hover { background-color: #333 !important; }
        [data-theme="light"] .text-black { color: #fff !important; }
        [data-theme="light"] .hover\:bg-neutral-200:hover { background-color: #333 !important; }
        [data-theme="light"] code {
            background-color: #f0f0f0 !important;
            border-color: #e5e5e5 !important;
            color: #171717 !important;
        }
        [data-theme="light"] select { color: var(--text-heading) !important; }
        [data-theme="light"] select option { background: #fff; color: #171717; }
        [data-theme="light"] input { color: var(--text-heading) !important; }
    </style>
</head>
<body>

    <aside class="w-72 border-r border-neutral-800 bg-[#030303] flex flex-col h-full shrink-0">
        <div class="p-4 border-b border-neutral-800 space-y-3 shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <button id="theme-toggle-btn" class="p-1.5 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800 transition-colors" title="Toggle theme">
                        <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <h1 class="text-xl font-bold text-white tracking-tight">TheInfoDB</h1>
                </div>
            </div>
            <div class="relative flex items-center">
                <input type="text" id="quick-search-input" data-i18n-placeholder="searchEverythingPlaceholder" placeholder="Search everything..."
                       class="w-full bg-neutral-900 border border-neutral-700 text-sm text-white rounded px-3 py-1.5 focus:outline-none focus:border-neutral-500 pr-8">
                <button id="quick-search-clear" class="absolute right-2 text-neutral-500 hover:text-white hidden">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <div id="sidebar-resizable-container" class="p-3 flex flex-col" style="height: 380px; min-height: 120px; max-height: calc(100vh - 200px);">
            <div class="pages-panel border border-neutral-800 bg-[#050505] rounded-lg p-3 flex flex-col gap-2 flex-1 overflow-hidden min-h-0">
                <div class="flex items-center justify-between px-1 shrink-0">
                    <div class="text-[10px] font-semibold text-neutral-500 uppercase tracking-wider" data-i18n="pagesTitle">Pages</div>
                </div>
                <div class="relative flex items-center shrink-0">
                    <input type="text" id="page-search-input" data-i18n-placeholder="searchPagesPlaceholder" placeholder="Search pages..."
                           class="w-full bg-neutral-900 border border-neutral-700 text-xs text-white rounded px-2.5 py-1.5 focus:outline-none focus:border-neutral-500 pr-7">
                    <button id="page-search-clear" class="absolute right-2 text-neutral-500 hover:text-white hidden">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div id="pages-tree" class="text-xs mt-1 flex-1 overflow-y-auto min-h-0"></div>
            </div>
        </div>
        <div id="sidebar-resize-handle" class="h-2 w-full cursor-ns-resize bg-transparent hover:bg-neutral-800 transition-colors flex items-center justify-center shrink-0" title="Drag to resize">
            <div class="w-8 h-0.5 bg-neutral-700 rounded-full"></div>
        </div>
        <div class="flex-1"></div>
    </aside>

    <main class="flex-1 flex flex-col bg-black h-full relative overflow-hidden min-w-0">
        <header class="h-14 border-b border-neutral-800 flex items-center justify-between px-6 bg-[#030303] shrink-0">
            <div id="breadcrumb" class="text-sm font-medium text-neutral-400 truncate mr-4">
                Dashboard
            </div>

            <div class="flex items-center space-x-3 shrink-0">
                <select id="ui-language-select" class="bg-transparent border border-neutral-700 text-sm text-white rounded px-2 py-1 outline-none">
                    <option value="English" selected>English</option>
                    <option value="German">German</option>
                </select>

                <button id="toggle-split-view-btn" class="p-2 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800 transition-colors" title="Split View">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                </button>

                <button id="toggle-pins-btn" class="p-2 text-neutral-300 hover:text-white border border-neutral-700 rounded hover:bg-neutral-800 transition-colors" title="Pins">

    <div id="toast" class="toast">Message</div>
    <div id="global-tooltip"></div>

    <script>
        const state = {
            pages: [],
            fileCache: {},
            hyperlinks: {},
            tooltips: {},
            pinnedTopics: [],
            currentActiveFile: null,
            splitFile1: null,
            splitFile2: null,
            slot1Language: 'English',
            slot2Language: 'English',
            viewMode: 'Stylized',
            viewMode1: 'Stylized',
            viewMode2: 'Stylized',
            isSplitView: false,
            pendingLink: '',
            uiLanguage: 'English',
            translations: {},
            contextFile: null,
            theme: localStorage.getItem('theme') || 'dark',
            treeOpenState: {},
            pageRegistry: {},
            docFontScale1: parseFloat(localStorage.getItem('docFontScale1') || '1'),
            docFontScale2: parseFloat(localStorage.getItem('docFontScale2') || '1')
        };

        const defaultTranslations = {
            searchPagesPlaceholder: "Search pages...",
            searchEverythingPlaceholder: "Search everything...",
            pagesTitle: "Pages",
            dashboardTitle: "Dashboard",
            viewModeStylized: "Markdown",
            viewModeRaw: "Raw",
            downloadTextfile: "Textfile",
            downloadMarkdown: "Markdown",
            dashboardOverview: "Overview",
            noMatchingTopics: "No matching topics found.",
            pinnedTopicsTitle: "Pinned Topics",
            noPinsMsg: "No topics pinned yet.",
            linkModalTitle: "External Link",
            linkModalText: "You are leaving this page. Are you sure?",
            linkModalCancel: "Cancel",
            linkModalOkay: "Okay",
            toastCopied: "Copied to Clipboard!",
            toastPinned: "Pinned topic",
            toastNoFile: "No file selected.",
            toastNoPins: "No pins to download.",
            searchResults: "Search Results:",
            jumpToTitle: "Jump to section",
            jumpNoSections: "No sections in this document.",
            toastJumped: "Jumped to"
        };

        const FIXED_ENGLISH_KEYS = new Set(['viewModeStylized', 'viewModeRaw']);
        const SUPPORTED_LANGUAGES = ['English', 'German'];

        const dom = {
            qsInput: document.getElementById('quick-search-input'),
            qsClear: document.getElementById('quick-search-clear'),
            pageSearchInput: document.getElementById('page-search-input'),
            pageSearchClear: document.getElementById('page-search-clear'),
            pagesTree: document.getElementById('pages-tree'),
            dashboardView: document.getElementById('dashboard-view'),
            dashboardGrid: document.getElementById('dashboard-grid'),
            documentView: document.getElementById('document-view'),
            documentContent: document.getElementById('document-content'),
            documentContentSecondary: document.getElementById('document-content-secondary'),
            splitDivider: document.getElementById('split-divider'),
            contentScrollArea: document.getElementById('content-scroll-area'),
            breadcrumb: document.getElementById('breadcrumb'),
            uiLanguageSelect: document.getElementById('ui-language-select'),
            toggleSplitViewBtn: document.getElementById('toggle-split-view-btn'),
            pinsBtn: document.getElementById('toggle-pins-btn'),
            pinsSidebar: document.getElementById('pins-sidebar'),
            pinsContainer: document.getElementById('pins-container'),
            pinsResizableContainer: document.getElementById('pins-resizable-container'),
            pinsResizeHandle: document.getElementById('pins-resize-handle'),
            noPinsMsg: document.getElementById('no-pins-msg'),
            toast: document.getElementById('toast'),
            globalTooltip: document.getElementById('global-tooltip'),
            linkModal: document.getElementById('link-modal'),
            linkCancel: document.getElementById('link-cancel'),
            linkOkay: document.getElementById('link-okay'),
            contextMenu: document.getElementById('context-menu'),
            ctxOpenLeft: document.getElementById('ctx-open-left'),
            ctxOpenRight: document.getElementById('ctx-open-right'),
            themeToggleBtn: document.getElementById('theme-toggle-btn'),
            themeIconSun: document.getElementById('theme-icon-sun'),
            themeIconMoon: document.getElementById('theme-icon-moon'),
            sidebarResizableContainer: document.getElementById('sidebar-resizable-container'),
            sidebarResizeHandle: document.getElementById('sidebar-resize-handle')
        };

        /* ---------------- Font scale ---------------- */
        function applyDocFontScope(columnEl, slotTag) {
            if (!columnEl) return;
            const scale = slotTag === '2' ? state.docFontScale2 : state.docFontScale1;
            columnEl.classList.add('doc-scope');
            columnEl.style.setProperty('--doc-scale', String(scale));
        }

        function buildDocFontSizeControl(slotTag) {
            const size = document.createElement('select');
            size.className = "toolbar-select";
            size.title = "Document font size";
            [['0.85','85%'],['0.9','90%'],['1','100%'],['1.1','110%'],['1.25','125%'],['1.5','150%']].forEach(([v,l]) => {
                const o = document.createElement('option');
                o.value = v;
                o.textContent = l;
                size.appendChild(o);
            });
            size.value = String(slotTag === '2' ? state.docFontScale2 : state.docFontScale1);

            size.addEventListener('change', () => {
                const val = parseFloat(size.value) || 1;
                if (slotTag === '2') {
                    state.docFontScale2 = val;
                    localStorage.setItem('docFontScale2', String(val));
                    applyDocFontScope(dom.documentContentSecondary, '2');
                } else {
                    state.docFontScale1 = val;
                    localStorage.setItem('docFontScale1', String(val));
                    applyDocFontScope(dom.documentContent, '1');
                }
            });
            return size;
        }

        function buildDocViewModeControl(slotTag) {
            const sel = document.createElement('select');
            sel.className = "toolbar-select";
            sel.title = "View mode";
            const modes = [
                ['Stylized', state.translations.viewModeStylized || 'Markdown'],
                ['Raw', state.translations.viewModeRaw || 'Raw']
            ];
            modes.forEach(([v,label]) => {
                const o = document.createElement('option');
                o.value = v;
                o.textContent = label;
                sel.appendChild(o);
            });
            const current = slotTag === '2' ? state.viewMode2 : (state.isSplitView ? state.viewMode1 : state.viewMode);
            sel.value = current;

            sel.addEventListener('change', () => {
                if (state.isSplitView) {
                    if (slotTag === '2') state.viewMode2 = sel.value;
                    else state.viewMode1 = sel.value;
                    renderSplitView();
                } else {
                    state.viewMode = sel.value;
                    if (state.currentActiveFile) handleFileSelection(state.currentActiveFile);
                }
            });
            return sel;
        }

        // Extract the FIRST "# " heading from markdown content. Returns null if none.
        function extractFirstHeading(md) {
            if (!md) return null;
            const lines = md.split('\n');
            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('# ')) {
                    return trimmed.slice(2).trim();
                }
            }
            return null;
        }

        async function init() {
            applyTheme(state.theme);
            dom.uiLanguageSelect.value = 'English';
            await loadHyperlinks();
            await loadTooltips();
            await loadPageRegistry();
            await loadLanguage('English');
            await fetchGitHubTree();
            // Preload all markdown so we can read the first "# " heading of each file.
            await preloadContentForAllLanguages();
            // Now assign document names from the first heading (fallback: filename stem).
            resolveDocumentTitles();
            renderTree(state.pages, dom.pagesTree);
            renderDashboard();
            setupEventListeners();
            setupSidebarResize();
            setupPinsResize();
            setupTooltipEngine();
        }

        // Use the first "# " heading of the preferred-language file as the display title.
        // Falls back to the filename stem if no heading exists.
        function resolveDocumentTitles() {
            state.pages.forEach(p => {
                if (!p.paths) return;
                const preferredLangs = [state.uiLanguage, 'English'];
                let heading = null;
                for (const l of preferredLangs) {
                    const path = p.paths[l];
                    if (!path) continue;
                    const content = state.fileCache[path];
                    if (!content) continue;
                    const h = extractFirstHeading(content);
                    if (h) { heading = h; break; }
                }
                p.title = heading || p.fallbackTitle || p.title;
            });
        }

        function setupSidebarResize() {
            let isResizing = false;
            let startY = 0;
            let startHeight = 0;

            dom.sidebarResizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startY = e.clientY;
                startHeight = dom.sidebarResizableContainer.getBoundingClientRect().height;
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const delta = e.clientY - startY;
                const newHeight = startHeight + delta;
                const minH = 120;
                const maxH = window.innerHeight - 200;
                if (newHeight >= minH && newHeight <= maxH) {
                    dom.sidebarResizableContainer.style.height = `${newHeight}px`;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = '';
                }
            });
        }

        function setupPinsResize() {
            let isResizing = false;
            let startY = 0;
            let startHeight = 0;

            dom.pinsResizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startY = e.clientY;
                startHeight = dom.pinsResizableContainer.getBoundingClientRect().height;
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const delta = startY - e.clientY;
                const newHeight = startHeight + delta;
                const minH = 120;
                const maxH = window.innerHeight - 120;
                if (newHeight >= minH && newHeight <= maxH) {
                    dom.pinsResizableContainer.style.height = `${newHeight}px`;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = '';
                }
            });
        }

        function setupTooltipEngine() {
            let hideTimer = null;

            document.addEventListener('mouseover', (e) => {
                const el = e.target.closest && e.target.closest('.tooltip-term');
                if (!el) return;
                const term = el.getAttribute('data-term');
                const desc = state.tooltips[term];
                if (!desc) return;

                clearTimeout(hideTimer);
                dom.globalTooltip.textContent = desc;
                dom.globalTooltip.classList.add('show');

                const rect = el.getBoundingClientRect();
                const tipRect = dom.globalTooltip.getBoundingClientRect();
                let left = rect.left + rect.width / 2 - tipRect.width / 2;
                let top = rect.top - tipRect.height - 8;
                if (left < 8) left = 8;
                if (left + tipRect.width > window.innerWidth - 8) {
                    left = window.innerWidth - tipRect.width - 8;
                }
                if (top < 8) top = rect.bottom + 8;
                dom.globalTooltip.style.left = `${left}px`;
                dom.globalTooltip.style.top = `${top}px`;
            });

            document.addEventListener('mouseout', (e) => {
                const el = e.target.closest && e.target.closest('.tooltip-term');
                if (!el) return;
                hideTimer = setTimeout(() => {
                    dom.globalTooltip.classList.remove('show');
                }, 60);
            });

            window.addEventListener('scroll', () => {
                dom.globalTooltip.classList.remove('show');
            }, true);
        }

        /* ---------------- Theme ---------------- */
        function applyTheme(theme) {
            state.theme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'light') {
                dom.themeIconSun.style.display = 'none';
                dom.themeIconMoon.style.display = 'block';
            } else {
                dom.themeIconSun.style.display = 'block';
                dom.themeIconMoon.style.display = 'none';
            }
        }

        /* ---------------- Data loading ---------------- */
        async function loadHyperlinks() {
            try {
                const res = await fetch('./hyperlinks.json');
                if (res.ok) {
                    state.hyperlinks = await res.json();
                }
            } catch (e) {
                state.hyperlinks = {};
            }
        }

        async function loadTooltips() {
            try {
                const res = await fetch('./mouseOverTooltips.json');
                if (res.ok) {
                    state.tooltips = await res.json();
                }
            } catch (e) {
                state.tooltips = {};
            }
        }

        async function loadPageRegistry() {
            state.pageRegistry = {};
            await Promise.allSettled(SUPPORTED_LANGUAGES.map(async (lang) => {
                try {
                    const res = await fetch(`./languages/pages/pagesLanguage_${lang}.json`);
                    if (res.ok) {
                        state.pageRegistry[lang] = await res.json();
                    } else {
                        state.pageRegistry[lang] = {};
                    }
                } catch (e) {
                    state.pageRegistry[lang] = {};
                }
            }));
        }

        function translateFolder(rawName) {
            const langMap = state.pageRegistry[state.uiLanguage];
            if (langMap && langMap[rawName]) return langMap[rawName];
            const enMap = state.pageRegistry['English'];
            if (enMap && enMap[rawName]) return enMap[rawName];
            return rawName;
        }

        async function fetchGitHubTree() {
            try {
                const res = await fetch('https://api.github.com/repos/cmdrFRANKLY1/TheInfoDB/git/trees/main?recursive=1');
                if (!res.ok) throw new Error("Could not reach GitHub API");
                const data = await res.json();

                const pagesMap = {};
                // Filename stem is used as a fallback title, and as a stable ID base.
                // The actual displayed title will come from the first "# " heading later.
                const extractStem = (filename) => {
                    return filename
                        .replace(/_in[a-zA-Z]+\.md$/, '')
                        .replace(/\.md$/, '');
                };

                data.tree.forEach(node => {
                    if (node.type === 'blob' && node.path.startsWith('Pages/') && node.path.endsWith('.md')) {
                        const pathParts = node.path.split('/');
                        const filename = pathParts.pop();
                        const stem = extractStem(filename);

                        const dirParts = pathParts.slice(1);
                        if (dirParts.length > 0) {
                            const lastFolder = dirParts[dirParts.length - 1];
                            if (lastFolder.toLowerCase() === stem.toLowerCase()) {
                                dirParts.pop();
                            }
                        }

                        const displayCategoryParts = dirParts.map(p => translateFolder(p));
                        const category = displayCategoryParts.join(' / ');
                        // ID is stable: uses raw dir path + filename stem.
                        const id = (dirParts.length > 0 ? `${dirParts.join('/')}/` : '') + stem;

                        const langMatch = filename.match(/_in([a-zA-Z]+)\.md$/);
                        const lang = langMatch ? langMatch[1] : 'English';

                        if (!pagesMap[id]) {
                            pagesMap[id] = {
                                id,
                                title: stem,           // provisional; replaced by first heading after preload
                                fallbackTitle: stem,   // keep the filename stem as fallback
                                category,
                                rawCategoryParts: dirParts.slice(),
                                categoryParts: displayCategoryParts,
                                paths: {}
                            };
                        }
                        pagesMap[id].paths[lang] = node.path;
                    }
                });
                state.pages = Object.values(pagesMap);
            } catch (e) {
                console.error(e);
                dom.dashboardGrid.innerHTML = `<div class="text-red-500">Failed to load repository tree. Check console for details.</div>`;
            }
        }

        function retranslatePages() {
            state.pages.forEach(p => {
                if (p.rawCategoryParts && p.rawCategoryParts.length > 0) {
                    p.categoryParts = p.rawCategoryParts.map(x => translateFolder(x));
                    p.category = p.categoryParts.join(' / ');
                } else {
                    p.categoryParts = [];
                    p.category = '';
                }
            });
        }

        async function preloadContentForAllLanguages() {
            const promises = [];
            state.pages.forEach(pageObj => {
                Object.values(pageObj.paths).forEach(path => {
                    if (path && !state.fileCache[path]) {
                        promises.push(
                            fetch(`https://raw.githubusercontent.com/cmdrFRANKLY1/TheInfoDB/main/${path}`)
                                .then(res => res.ok ? res.text() : null)
                                .then(text => { if (text) state.fileCache[path] = text; })
                                .catch(() => {})
                        );
                    }
                });
            });
            await Promise.allSettled(promises);
        }

        async function loadLanguage(lang) {
            state.uiLanguage = lang;

            let loaded = {};
            try {
                const res = await fetch(`./languages/index/indexLanguage_${lang}.json`);
                if (res.ok) {
                    loaded = await res.json();
                }
            } catch (e) {
                loaded = {};
            }

            state.translations = Object.assign({}, defaultTranslations, loaded);
            FIXED_ENGLISH_KEYS.forEach(key => {
                state.translations[key] = defaultTranslations[key];
            });

            applyTranslations();
        }

        function applyTranslations() {
            const t = state.translations;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });
            if (!state.currentActiveFile && dom.dashboardView.classList.contains('hidden') === false) {
                dom.breadcrumb.textContent = t.dashboardTitle;
            }
            if (state.pinnedTopics.length === 0) {
                dom.noPinsMsg.textContent = t.noPinsMsg;
            }
        }

        function showToast(msg) {
            dom.toast.textContent = msg;
            dom.toast.classList.add('show');
            setTimeout(() => dom.toast.classList.remove('show'), 2000);
        }

        function getFileDisplayPath(file) {
            if (!file) return "";
            return file.category && file.category !== '' ? `${file.category} / ${file.title}` : file.title;
        }

        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function pickLang(file) {
            if (!file || !file.paths) return 'English';
            if (state.uiLanguage === 'German' && file.paths['German']) return 'German';
            if (file.paths[state.uiLanguage]) return state.uiLanguage;
            if (file.paths['English']) return 'English';
            return Object.keys(file.paths)[0];
        }

        /* ---------------- Sidebar tree ---------------- */
        function renderTree(files, container) {
            container.innerHTML = '';
            const tree = { folders: {}, files: [] };

            files.forEach(f => {
                let current = tree;
                if (f.categoryParts && f.categoryParts.length > 0) {
                    const rawParts = (f.rawCategoryParts && f.rawCategoryParts.length)
                        ? f.rawCategoryParts
                        : f.categoryParts;
                    rawParts.forEach((rawPart, idx) => {
                        const displayPart = (f.categoryParts && f.categoryParts[idx]) || translateFolder(rawPart);
                        if (!current.folders[rawPart]) {
                            current.folders[rawPart] = {
                                folders: {},
                                files: [],
                                displayName: displayPart
                            };
                        }
                        current = current.folders[rawPart];
                    });
                }
                current.files.push(f);
            });

            function buildDOM(node, containerElement, rawPathPrefix = '') {
                Object.keys(node.folders).sort((a, b) => {
                    const da = node.folders[a].displayName || a;
                    const db = node.folders[b].displayName || b;
                    return da.localeCompare(db);
                }).forEach(rawFolderName => {
                    const folderData = node.folders[rawFolderName];
                    const rawFolderPath = rawPathPrefix ? `${rawPathPrefix}/${rawFolderName}` : rawFolderName;

                    const details = document.createElement('details');
                    details.className = "tree-details mb-0.5";
                    if (state.treeOpenState[rawFolderPath] !== undefined) {

        async function fetchContent(path) {
            if (state.fileCache[path]) return state.fileCache[path];
            try {
                const res = await fetch(`https://raw.githubusercontent.com/cmdrFRANKLY1/TheInfoDB/main/${path}`);
                if (res.ok) {
                    const text = await res.text();
                    state.fileCache[path] = text;
                    return text;
                }
                return "Failed to fetch document content.";
            } catch(e) {
                return "Network error loading document.";
            }
        }

        /* ---------------- Single document view ---------------- */
        async function handleFileSelection(pageObj, preferredLang = null) {
            dom.contentScrollArea.classList.remove('split-active');
            dom.dashboardView.classList.add('hidden');
            dom.documentView.classList.remove('hidden');
            dom.documentView.classList.remove('max-w-[1600px]', 'w-full');
            dom.documentView.classList.add('w-full', 'max-w-[1000px]');
            dom.splitDivider.classList.add('hidden');

            const targetLang = preferredLang || state.uiLanguage;
            const defaultLang = pageObj.paths[targetLang] ? targetLang : pickLang(pageObj);
            state.slot1Language = defaultLang;

            if (state.isSplitView) {
                if (!state.splitFile1) {
                    state.splitFile1 = pageObj;
                    state.slot1Language = defaultLang;
                } else if (!state.splitFile2) {
                    state.splitFile2 = pageObj;
                    state.slot2Language = defaultLang;
                } else {
                    state.splitFile1 = pageObj;
                    state.slot1Language = defaultLang;
                }
                await renderSplitView();
            } else {
                state.currentActiveFile = pageObj;
                state.splitFile1 = null;

                dom.documentContent.classList.remove('split-column');
                dom.documentContentSecondary.classList.add('hidden');
                dom.documentContentSecondary.classList.remove('split-column');

                dom.breadcrumb.textContent = getFileDisplayPath(pageObj);
                dom.documentContent.innerHTML = '<div class="text-neutral-500 mt-10">Loading...</div>';

                if (!path) {

                applyDocFontScope(dom.documentContent, '1');

                    state.viewMode,

                    (newLang) => {

        /* ---------------- Global search ---------------- */
        async function executeGlobalSearch(query) {
            if (!query) {
                if (state.isSplitView) {
                    renderSplitView();
                } else if (state.currentActiveFile) {
                    handleFileSelection(state.currentActiveFile);
                } else {
                    renderDashboard();
                }
                return;
            }

            dom.contentScrollArea.classList.remove('split-active');
            dom.documentView.classList.remove('max-w-[1600px]', 'w-full');
            dom.documentView.classList.add('w-full', 'max-w-[1000px]');
            dom.documentContentSecondary.classList.add('hidden');
            dom.documentContent.classList.remove('split-column');
            dom.documentContentSecondary.classList.remove('split-column');
            dom.splitDivider.classList.add('hidden');

            dom.dashboardView.classList.add('hidden');
            dom.documentView.classList.remove('hidden');
            dom.breadcrumb.textContent = `${state.translations.searchResults || 'Search Results:'} "${query}"`;
            dom.documentContent.innerHTML = '';

            applyDocFontScope(dom.documentContent, '1');

            const lang = state.slot1Language;
            const q = query.toLowerCase();
            let foundAny = false;

            for (const file of state.pages) {
                const path = file.paths[lang] || file.paths['English'] || Object.values(file.paths)[0];
                if (!path) continue;
                const content = await fetchContent(path);
                if (content.toLowerCase().includes(q)) {
                    foundAny = true;
                    parseAndRenderMarkdownDocument(content, dom.documentContent, file, state.viewMode, true, query, '', null, lang, null);
                }
            }

            if (!foundAny) {
                dom.documentContent.innerHTML = `<div class="text-neutral-500 text-center mt-10">${state.translations.noMatchingTopics}</div>`;
            }
        }

        /* ---------------- Markdown helpers ---------------- */
        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function buildTooltipRegex() {
            const keys = Object.keys(state.tooltips || {});
            if (keys.length === 0) return null;
            const escaped = keys
                .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                .sort((a, b) => b.length - a.length);
            return new RegExp(`\\b(${escaped.join('|')})\\b`, 'g');
        }

        function injectTooltips(html) {
            if (!html) return html;
            const rx = buildTooltipRegex();
            if (!rx) return html;

            const parts = html.split(/(<[^>]+>)/g);
            return parts.map(part => {
                if (!part) return part;
                if (part.startsWith('<')) return part;
                return part.replace(rx, (match) => {
                    const exactKey = Object.keys(state.tooltips).find(k => k.toLowerCase() === match.toLowerCase());
                    if (!exactKey) return match;
                    return `<span class="tooltip-term" data-term="${exactKey}">${match}</span>`;
                });
            }).join('');
        }

        function formatMarkdownText(text) {
            if (!text) return '';
            let escaped = escapeHtml(text);
            let formatted = escaped
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code class="bg-neutral-900 border border-neutral-800 text-neutral-200 px-1.5 py-0.5 rounded text-xs font-mono">$1</code>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" class="text-blue-400 hover:underline external-link">$1</a>');

            if (state.hyperlinks && Object.keys(state.hyperlinks).length > 0) {
                Object.entries(state.hyperlinks).forEach(([term, url]) => {
                    const regex = new RegExp(`\\b(${term})\\b(?![^<]*>|[^<>]*</a>)`, 'g');
                    formatted = formatted.replace(regex, `<a href="${url}" class="text-blue-400 hover:underline external-link">$1</a>`);
                });
            }

            const lines = formatted.split('\n');
            const out = [];
            let listBuffer = [];
            const flushList = () => {
                if (listBuffer.length) {
                    out.push(`<ul class="list-disc pl-5 space-y-1 my-2">${listBuffer.map(i => `<li>${i}</li>`).join('')}</ul>`);
                    listBuffer = [];
                }
            };
            lines.forEach(line => {
                if (line.trim().startsWith('- ')) {
                    listBuffer.push(line.trim().replace(/^- /, ''));
                } else {
                    flushList();
                    out.push(line);
                }
            });
            flushList();

            let joined = out.join('<br>').replace(/(<br>)+(<ul)/g, '$2').replace(/(<\/ul>)(<br>)+/g, '$1');
            joined = injectTooltips(joined);
            return joined;
        }

        function parseAdvancedMarkdown(content) {
            const lines = content.split('\n');
            let overallTitle = "Document";
            const mainSections = [];
            let currentMain = null;
            let currentSub = null;
            let introBuffer = [];

            const flushIntro = () => {
                if (currentMain && introBuffer.length > 0 && !currentMain.intro) {
                    currentMain.intro = processBlockContent(introBuffer);
                }
                introBuffer = [];
            };

            let i = 0;
            while (i < lines.length) {
                const line = lines[i];

                if (line.startsWith('# ')) {
                    if (currentMain) {
                        flushIntro();
                        if (currentSub) { currentMain.subtopics.push(currentSub); currentSub = null; }
                        mainSections.push(currentMain);
                    }
                    overallTitle = line.replace(/^#\s+/, '');
                    currentMain = { title: overallTitle, intro: '', subtopics: [] };
                    currentSub = null;
                    i++;
                } else if (line.startsWith('## ') || line.startsWith('### ')) {
                    if (currentMain) {
                        flushIntro();
                        if (currentSub) currentMain.subtopics.push(currentSub);
                        const subTitle = line.replace(/^#{2,3}\s+/, '');
                        const level = line.startsWith('### ') ? 3 : 2;
                        currentSub = { title: subTitle, level, contentLines: [] };
                    }
                    i++;
                } else {
                    if (currentSub) {
                        currentSub.contentLines.push(line);
                    } else {
                        introBuffer.push(line);
                    }
                    i++;
                }
            }

            if (currentMain) {
                flushIntro();
                if (currentSub) currentMain.subtopics.push(currentSub);
                mainSections.push(currentMain);
            }

            if (mainSections.length === 0) {
                mainSections.push({ title: overallTitle, intro: processBlockContent(lines), subtopics: [] });
            }

            return mainSections;
        }

        function processBlockContent(linesArr) {
            const processed = [];
            let tableBuffer = [];

            const flushTable = () => {
                if (tableBuffer.length >= 2) {
                    const headers = tableBuffer[0].split('|').map(s => s.trim()).filter(Boolean);
                    const rows = tableBuffer.slice(2).map(r => r.split('|').map(s => s.trim()).filter(Boolean));
                    let html = '<div class="overflow-x-auto"><table class="w-full border-collapse my-3"><thead><tr>';
                    headers.forEach(h => html += `<th class="border border-neutral-800 p-2 text-left text-xs bg-neutral-900 text-white">${formatMarkdownText(h)}</th>`);
                    html += '</tr></thead><tbody>';
                    rows.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => html += `<td class="border border-neutral-800 p-2 text-xs text-neutral-300">${formatMarkdownText(cell)}</td>`);
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    processed.push(html);
                }
                tableBuffer = [];
            };

            for (let idx = 0; idx < linesArr.length; idx++) {
                const l = linesArr[idx];
                if (l.trim().startsWith('|') && l.trim().endsWith('|')) {
                    tableBuffer.push(l.trim());
                } else {
                    flushTable();
                    if (l.trim() === '---') {
                        processed.push('<hr class="border-neutral-800 my-4">');
                    } else if (l.trim() !== '') {
                        processed.push(formatMarkdownText(l));
                    }
                }
            }
            flushTable();
            return processed.join('<br>');
        }

        function assembleTopicMarkdown(section) {
            const lines = [];
            lines.push(`# ${section.title}`);
            lines.push('');

            if (section.intro) {
                const rawIntro = section.intro
                    .replace(/<br\s*\/?>/gi, '\n')
                    .replace(/<[^>]+>/g, '')
                    .replace(/&amp;/g, '&')
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&quot;/g, '"')
                    .trim();
                if (rawIntro) {
                    lines.push(rawIntro);
                    lines.push('');
                }
            }

            (section.subtopics || []).forEach(sub => {
                const prefix = sub.level === 3 ? '###' : '##';
                lines.push(`${prefix} ${sub.title}`);
                lines.push('');
                const body = (sub.contentLines || []).join('\n').trim();
                if (body) {
                    lines.push(body);
                    lines.push('');
                }
            });

            return lines.join('\n').trim();
        }

        /* ---------------- Document renderer ---------------- */
        function parseAndRenderMarkdownDocument(content, container, fileData, viewModeOverride = null, isSearch = false, query = '', slotTag = '', onClose = null, activeDocLang = 'English', onDocLangChange = null, columnLabel = null, columnColor = null) {

            if (fileData) {

                slotHeader.appendChild(titleBadge);

                const rightControls = document.createElement('div');
                rightControls.className = "flex items-center space-x-2 shrink-0";
